<title>수저 게임 · 시안 · 이 시기 마음 쓸 곳 (초점 고르기)</title>
<!-- 시안(정적 HTML) — SPEC-018 PL12 「초점 고르기」 화면, designer, 형진 님 선택 전.
     계약: docs/data/focus-spend-model.md 5절(5-4 「화면이 지켜야 할 계약」 1~7) · 12-2절(결정 후속 265). 돈 쓰기 화면은 범위 밖이다.
     대시보드 DOM은 spec-011 작업 트리의 개발 서버가 실제로 그린 인생 화면을 옮겼다(엑스 세대 시드 7 — 같은 인물의 14·17·41·44·66세(화면 나이)와 자동 모드 결정 대기 1장). 스타일은 src/styles의 구현 CSS를 그대로 불러 쓴다.
     새로 더한 것은 아래 <style>의 「제안: 마음 쓸 곳」 블록(기존 토큰만)과 세 안의 배치뿐이다.
     ?plan=A|B|C|none  &state=A|B|B2|C|C65|D|D0|E  &theme=dark  &text=200  ·  인자 없이 열면 목록. -->

<link rel="stylesheet" href="../../../../src/styles/tokens.css">
<link rel="stylesheet" href="../../../../src/styles.css">

<style>
/* ===== 제안: 마음 쓸 곳 (SPEC-018 PL12) — 새 토큰 0 · 새 색 쌍 0 · 새 아이콘 0(스프라이트 i-check) =====
   공통 부품 하나(.focus-pick 고르기 묶음 + .focus-now 상시 줄)를 세 안이 다른 자리에 둔다. 구현은 dash.css 끝에 같은 글자로 옮긴다.
   고르기 단추 = button.chip-opt(title.css 「시·도 칩」과 같은 부품) + aria-pressed. 보이는 높이 36px, 누르는 영역은 굵은 포인터에서 위아래 4px씩 늘려 44px(--hit). */
.focus-pick { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.focus-opt { min-height: 36px; }
.focus-opt[aria-pressed='true'] { border: 2px solid var(--c-brand); padding: 0 calc(var(--sp-3) - 1px); background: var(--c-brand-soft); color: var(--c-on-brand-soft); }
.focus-opt[aria-pressed='true'] .icon { display: block; }
.focus-opt:focus-visible { outline: 3px solid var(--c-focus); outline-offset: 2px; }
@media (pointer: coarse) { .focus-opt::after { content: ''; position: absolute; inset: -4px 0; } }
.focus-desc { font-size: var(--fs-sm); line-height: var(--lh-snug); color: var(--c-text-2); word-break: keep-all; }
.focus-note { font-size: var(--fs-sm); line-height: var(--lh-snug); color: var(--c-text-2); word-break: keep-all; }
.focus-title { font-size: var(--fs-lg); line-height: var(--lh-snug); font-weight: var(--fw-bold); word-break: keep-all; }
.focus-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--sp-1) var(--sp-3); }
.focus-head .btn { white-space: nowrap; }
/* 상시 줄: 「마음 쓰는 곳」 · 값 · 「바꾸기」(값이 이번 시기 목록에 없으면 아래 한 줄) */
.focus-now { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-1) var(--sp-3); }
.focus-now__label { font-size: var(--fs-sm); font-weight: var(--fw-regular); color: var(--c-text-2); white-space: nowrap; }
.focus-now__value { font-size: var(--fs-md); font-weight: var(--fw-bold); white-space: nowrap; }
.focus-now__btn { margin-left: auto; white-space: nowrap; }
.focus-now__note { flex-basis: 100%; font-size: var(--fs-sm); line-height: var(--lh-snug); color: var(--c-text-2); word-break: keep-all; }
.focus-now[data-idle='true'] .focus-now__value { color: var(--c-text-2); }
.focus-open { display: flex; flex-direction: column; gap: var(--sp-3); padding-top: var(--sp-3); margin-top: var(--sp-3); border-top: 1px solid var(--c-border); }

/* 안 A — 그림 아래 카드: 가운데 열 「집과 가족 그림」 바로 아래(LifeScreen 주석의 「올해 마음 쓸 곳」 자리). 한 열(≤ 959px)에서는 결정 카드들 → 그림 → 이 카드 → 시대의 창 순서(order -1 묶음의 DOM 순서) */
.focus-card { display: flex; flex-direction: column; gap: var(--sp-3); }
.focus-card--set { padding-block: var(--sp-3); gap: 0; }
@media (max-width: 959px) { .focus-card { order: -1; } }

/* 안 B — 머리 띠: 도구 줄 아래 전체 폭 띠(묻는 동안) + 머리 진행률 줄 끝의 칩(상시) */
.focus-band { background: var(--c-surface); border-bottom: 1px solid var(--c-border); border-top: 1px solid var(--c-border); }
.focus-band__inner { max-width: var(--w-page); margin: 0 auto; padding: var(--sp-3) var(--gutter); display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: 'title skip' 'desc desc' 'pick pick' 'note note'; gap: var(--sp-2) var(--sp-3); align-items: center; }
.focus-band__inner > .focus-title { grid-area: title; }
.focus-band__inner > .focus-desc { grid-area: desc; }
.focus-band__inner > .focus-pick { grid-area: pick; }
.focus-band__inner > .focus-band__skip { grid-area: skip; }
.focus-band__inner > .focus-band__notes { grid-area: note; }
.focus-band__inner > .focus-now { grid-column: 1 / -1; }
.focus-band__inner--set { grid-template-areas: 'now now' 'desc desc' 'pick pick'; }
@media (min-width: 960px) {
  .focus-band__inner { grid-template-columns: minmax(0, 27rem) minmax(0, 1fr) auto; grid-template-areas: 'title pick skip' 'desc pick skip' 'note pick skip'; gap: 2px var(--sp-6); }
  .focus-band__inner--set { grid-template-areas: 'now now now' 'desc pick pick'; gap: var(--sp-2) var(--sp-6); }
}
.focus-chip { position: relative; display: inline-flex; align-items: center; gap: var(--sp-1); min-height: 28px; padding: 0 var(--sp-2); border: 1px solid var(--c-border-strong); border-radius: var(--r-pill); background: var(--c-surface); color: var(--c-text); font: inherit; font-size: var(--fs-sm); line-height: 1.2; white-space: nowrap; cursor: pointer; }
.focus-chip b { font-weight: var(--fw-bold); }
.focus-chip__k { color: var(--c-text-2); }
.focus-chip::after { content: ''; position: absolute; inset: -8px -2px; }
.focus-chip:focus-visible { outline: 3px solid var(--c-focus); outline-offset: 2px; }
.year-row--focus { grid-template-columns: auto minmax(0, 1fr) auto auto; }

/* 안 C — 인생 기록 첫 줄: 기록 카드 머리와 목록 사이(쌓이는 ol 바깥 — 낭독 영역 aria-live 안에 단추를 두지 않는다) */
.focus-row { display: flex; flex-wrap: wrap; gap: var(--sp-1) var(--sp-2); padding: var(--sp-3) var(--sp-3) var(--sp-3) var(--sp-1); margin-bottom: var(--sp-2); border-radius: var(--r-md); background: var(--c-surface-2); }
.focus-row__body { flex: 1 1 14rem; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-2); }
.focus-row .focus-title { font-size: var(--fs-md); }
.focus-row--set { padding: var(--sp-2) var(--sp-3); }

@media (forced-colors: active) {
  .focus-opt { border-color: CanvasText; background: Canvas; color: CanvasText; }
  .focus-opt[aria-pressed='true'] { forced-color-adjust: none; background: Highlight; color: HighlightText; border-color: CanvasText; }
  .focus-band, .focus-open { border-color: CanvasText; }
  .focus-row { border: 1px solid CanvasText; }
  .focus-chip { border-color: CanvasText; }
}

/* ===== 시안 전용: 목록 문서 ===== */
.fx-doc { max-width: 880px; margin: 0 auto; padding: var(--sp-7) var(--gutter, 16px) var(--sp-10); color: var(--c-text); }
.fx-doc h1 { font-size: var(--fs-2xl); line-height: var(--lh-tight); margin: 0 0 var(--sp-3); }
.fx-doc h2 { font-size: var(--fs-xl); line-height: var(--lh-snug); margin: var(--sp-8) 0 var(--sp-3); }
.fx-doc p, .fx-doc li { line-height: var(--lh-body); word-break: keep-all; }
.fx-doc ul { padding-left: 1.25em; margin: var(--sp-2) 0; }
.fx-doc li + li { margin-top: var(--sp-1); }
.fx-doc a { color: var(--c-link); }
.fx-doc table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); margin: var(--sp-3) 0; }
.fx-doc th, .fx-doc td { text-align: left; vertical-align: top; padding: var(--sp-2); border-bottom: 1px solid var(--c-border); }
</style>

estid="scene-people"><li><span class="fit-pair" data-split="false"><span class="fit-pair__probe" data-text="아버지 · 47세" aria-hidden="true"></span>아버지 · <span class="nowrap">47세</span></span></li><li><span class="fit-pair" data-split="false"><span class="fit-pair__probe" data-text="어머니 · 47세" aria-hidden="true"></span>어머니 · <span class="nowrap">47세</span></span></li><li><span class="fit-pair" data-split="false"><span class="fit-pair__probe" data-text="형 · 18세" aria-hidden="true"></span>형 · <span class="nowrap">18세</span></span></li><li data-self="true"><span class="fit-pair" data-split="false"><span class="fit-pair__probe" data-text="나 · 14세" aria-hidden="true"></span>나 · <span class="nowrap">14세</span></span></li><li><span class="fit-pair" data-split="false"><span class="fit-pair__probe" data-text="남동생 · 11세" aria-hidden="true"></span>남동생 · <span class="nowrap">11세</span></span></li><li><span class="fit-pair" data-split="false"><span class="fit-pair__probe" data-text="남동생 · 7세" aria-hidden="true"></span>남동생 · <span class="nowrap">7세</span></span></li><li>그 밖에 1명</li></ul><p class="scene__open"><button type="button" class="btn btn--ghost btn--sm" data-testid="scene-open-family">가족과 삶 열기</button></p></details><button type="button" class="btn btn--ghost btn--sm scene__fold" aria-expanded="true" aria-controls="scene-pic" data-testid="scene-fold">그림 접기</button></div></section><section class="card log" aria-labelledby="log-t" data-testid="log"><div class="card__head card__head--tight"><h2 id="log-t" class="card__title">인생 기록</h2><span class="t-xs t-faint" id="log-hint" data-testid="log-hint"><span class="keep-phrase">최신순 · 아래로</span> 스크롤하면 지난 기록</span></div><div class="log__list" role="region" aria-label="인생 기록" aria-describedby="log-hint" tabindex="0" data-testid="log-list"><ol aria-live="polite" aria-relevant="additions" class="log__rows"><li class="log__row log__row--tl" data-kind="timeline" data-tl="era" id="log-y1983" tabindex="-1" aria-live="off" data-testid="log-row-era"><span class="log__age">14세<small class="log__year">1983</small></span><span class="log__text"><span class="log__tl"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-era"></use></svg><span>시대의 창</span></span><span class="log__sent">6월, 헤어진 가족을 찾는 생방송이 가을까지 이어졌습니다.</span></span></li><li class="log__row log__row--latest" data-kind="event" data-testid="log-row"><span class="log__age">13세</span><span class="log__text">8살 위인 누나가 독립해 집을 나섰습니다.</span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">12세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">며칠째 집 앞을 서성이는 강아지, 어떻게 할까?</span><em class="log__by log__by--parent" data-testid="log-by" data-by="parent"><svg class="icon icon--xs" aria-hidden="true" focusable="false"><use href="#i-by-parent"></use></svg>부모님이 이렇게 정했습니다: 집에 들이지는 않고 먹이만 챙겨 주기로 한다</em><span class="log__result">집에 들이지는 않고 남은 밥만 챙겨 주기로 했습니다. 어느 날부터 강아지는 보이지 않았습니다.</span></span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">11세</span><span class="log__text">학교까지는 걸어서 한 시간이 걸렸습니다. 길에서 만난 동무들과 노래를 부르며 걸었습니다.</span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">11세</span><span class="log__text">친할머니가 81세에 세상을 떠나셨습니다.</span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">11세</span><span class="log__text">셋째 동생으로 남동생이 태어났습니다.</span></li><li class="log__row log__row--tl" data-kind="timeline" data-tl="era" id="log-y1980" tabindex="-1" aria-live="off" data-testid="log-row-era"><span class="log__age">11세<small class="log__year">1980</small></span><span class="log__text"><span class="log__tl"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-era"></use></svg><span>시대의 창</span></span><span class="log__sent">5월, 광주에 민주화 시위가 있었습니다.</span></span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">10세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">문방구 앞의 딱지와 구슬, 사 달라고 할까?</span><em>선택: 조른다</em><span class="log__result">며칠을 졸랐지만 어른은 고개를 저었습니다. 문방구 앞을 지날 때마다 걸음이 느려졌습니다.</span></span></li><li class="log__row log__row--tl" data-kind="timeline" data-tl="era" id="log-y1979" tabindex="-1" aria-live="off" data-testid="log-row-era"><span class="log__age">10세<small class="log__year">1979</small></span><span class="log__text"><span class="log__tl"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-era"></use></svg><span>시대의 창</span></span><span class="log__sent">이 해 가을 대통령이 세상을 떠났습니다.</span></span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">8세</span><span class="log__text">아이는 책가방을 메고 처음으로 학교에 갔습니다. 교문 앞에서 몇 번이나 뒤를 돌아보았습니다.</span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">8세</span><span class="log__text">둘째 동생으로 남동생이 태어났습니다.</span></li><li class="log__row log__row--stage" data-kind="stage" data-testid="log-row"><span class="log__age">8세</span><span class="log__text">학교에 들어갈 나이가 되었습니다.</span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">7세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">또래가 다니는 교실과 도장, 보내 달라고 할까?</span><em>선택: 조른다</em><span class="log__result">여러 번 졸랐지만 어른은 고개를 저었습니다. 또래가 배우러 가는 시간이면 혼자 골목에 남았습니다.</span></span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">5세</span><span class="log__text">아이는 눈에 띄는 것마다 이름과 까닭을 물었습니다. 아이의 질문은 하루 종일 끊이지 않았습니다.</span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">5세</span><span class="log__text">외할아버지가 68세에 세상을 떠나셨습니다.</span></li><li class="log__row log__row--tl" data-kind="timeline" data-tl="era" id="log-y1974" tabindex="-1" aria-live="off" data-testid="log-row-era"><span class="log__age">5세<small class="log__year">1974</small></span><span class="log__text"><span class="log__tl"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-era"></use></svg><span>시대의 창</span></span><span class="log__sent">수도권에 지하철이 처음 다녔습니다.</span></span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">4세</span><span class="log__text">남동생이 태어났습니다.</span></li><li class="log__row log__row--tl" data-kind="timeline" data-tl="era" id="log-y1973" tabindex="-1" aria-live="off" data-testid="log-row-era"><span class="log__age">4세<small class="log__year">1973</small></span><span class="log__text"><span class="log__tl"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-era"></use></svg><span>시대의 창</span></span><span class="log__sent">10월, 기름값이 크게 올라 물가가 뛰기 시작했습니다.</span></span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">3세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">일하러 나간 낮, 어디에 맡길까?</span><em class="log__by log__by--parent" data-testid="log-by" data-by="parent"><svg class="icon icon--xs" aria-hidden="true" focusable="false"><use href="#i-by-parent"></use></svg>부모님이 이렇게 정했습니다: 아이를 돌봐 주는 곳에 보낸다</em><span class="log__result">또래 아이들과 하루를 보내기 시작했습니다. 처음 몇 주는 아침마다 울었지만 차츰 익숙해졌습니다.</span></span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">2세</span><span class="log__text">겨울이면 온 식구가 아랫목에 모여 잤습니다. 밤새 연탄불이 꺼지지 않게 어른들이 번갈아 일어났습니다.</span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">2세</span><span class="log__text">아이가 처음으로 낱말 하나를 말했습니다. 곁에 있던 어른들이 한참을 웃었습니다.</span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">2세</span><span class="log__text">아이가 붙잡고 서더니 처음으로 혼자 몇 걸음을 걸었습니다. 모두가 숨을 죽였습니다.</span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">1세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">처음 먹는 밥, 무엇을 먹일까?</span><em class="log__by log__by--parent" data-testid="log-by" data-by="parent"><svg class="icon icon--xs" aria-hidden="true" focusable="false"><use href="#i-by-parent"></use></svg>부모님이 이렇게 정했습니다: 남이 만든 것을 사다 먹인다</em><span class="log__result">남이 만든 것을 사다 먹이며 끼니를 해결했습니다. 아이가 먹는 동안 어른들도 한숨 돌렸습니다.</span></span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">1세</span><span class="log__text">첫 예방 주사를 맞던 날, 아이는 크게 울었습니다. 어른들은 아이를 안아 달랜 뒤 집으로 돌아왔습니다.</span></li><li class="log__row log__row--tl" data-kind="timeline" data-tl="era" id="log-y1970" tabindex="-1" aria-live="off" data-testid="log-row-era"><span class="log__age">1세<small class="log__year">1970</small></span><span class="log__text"><span class="log__tl"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-era"></use></svg><span>시대의 창</span></span><span class="log__sent">7월, 서울과 부산을 잇는 고속도로가 뚫렸습니다.</span></span></li><li class="log__row log__row--stage" data-kind="stage" data-testid="log-row"><span class="log__age">1세</span><span class="log__text">1970년 12월, 충청남도의 넉넉하지는 않은 가정에서 3.3kg 남자아이로 태어났습니다. 셋째입니다. (3.3kg은 상위 약 40%)</span></li></ol></div></section></div><div class="col col--right"><section class="card era-card" id="era-card" aria-labelledby="era-title" data-testid="era-card" data-paired="true" style="--era-card-h: 303px;"><h2 id="era-title" class="card__title card__title--gap">시대의 창</h2><a class="era" id="scene-era" href="#log-y1983" data-era="era-1983-reunion-broadcast" data-kind="event" data-hidden="false" data-dec="1980" title="이산가족 찾기. 6월, 헤어진 가족을 찾는 생방송이 가을까지 이어졌습니다."><span class="era__pic" aria-hidden="true"><svg viewBox="0 0 40 32" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false"><defs><pattern id="era-era-dots" width=".62" height=".62" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx=".31" cy=".31" r=".11" fill="var(--c-scene-ink,#2b2a27)"></circle></pattern ta-split="true"><span class="fit-pair__probe" data-text="내가 태어나기 전에 세상을 떠남(51세)" aria-hidden="true"></span><span class="fit-pair__item">내가 태어나기 전에 세상을 <span class="keep-phrase">떠남(<span class="nowrap">51세</span>)</span></span></span></small></dd><dt>친할머니</dt><dd data-testid="family-grandparent" data-state="gone"><span class="family-who">정미자</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="81세에 세상을 떠남" aria-hidden="true"></span><span class="nowrap">81세에</span> 세상을 떠남</span></small></dd><dt>외할아버지</dt><dd data-testid="family-grandparent" data-state="gone"><span class="family-who">최영식</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="68세에 세상을 떠남" aria-hidden="true"></span><span class="nowrap">68세에</span> 세상을 떠남</span></small></dd></dl><button type="button" class="btn btn--ghost btn--sm family-more" aria-expanded="false" data-testid="family-more">더 보기</button><details class="disclosure family-basis" data-testid="family-basis"><summary>이 칸은 어떻게 정했나요</summary><p>식구의 이름, 나이, 사이, 직업과 집에 있는 것은 통계와 게임이 정한 값이 섞여 있습니다. 칸마다 어디까지가 통계인지 밝힙니다.</p><ul><li><strong>확인</strong> 식구가 몇 살까지 사셨는지는 통계청 간이생명표(1970~2024년)의 나이대별 사망확률로 정했습니다. 2024년 뒤에는 2024년 값을 그대로 씁니다.</li><li><strong>추정</strong> 1970년 앞의 생명표는 없어서, 1970년 값에 배율을 곱해 기대수명이 1970년대 추세선을 거꾸로 이은 값이 되게 맞췄습니다(30세 아래로는 내리지 않았습니다).</li><li><strong>확인</strong> 어머니가 아이를 낳은 나이는 인구동향조사의 연령별 출생아 구성비(1981~2025년)를 썼습니다.</li><li><strong>확인(환산)</strong> 1956~1980년은 인구총조사의 어머니 연령별 자녀 수를 거슬러 계산했습니다(오차 ±0.5세).</li><li><strong>추정</strong> 1956년 앞 출생은 1966년 인구총조사 표본의 출산 어머니 나이 분포(평균 29.7세)를 그대로 거슬러 썼습니다. 한 해의 분포를 앞 시대에 이은 추정입니다.</li><li><strong>확인(환산)</strong> 조부모와 함께 사는 비율은 인구총조사의 아동 가구 세대 구성(2000년과 2005년)에서 계산했습니다.</li><li><strong>추정</strong> 그 밖의 해는 3세대 이상 가구 비율에 1.85를 곱해 이었습니다(2000년과 2005년의 실제 배율 1.73과 1.99의 가운데).</li><li><strong>설계값</strong> 함께 사는 조부모가 친가인지 외가인지는 통계가 없어 친가 70%, 외가 30%로 정했습니다.</li><li><strong>확인(환산)</strong> 부모의 이혼은 이혼 건수에 미성년 자녀 수의 하한을 곱해 미성년 인구로 나눈 근사입니다(1993~2025년).</li><li><strong>추정</strong> 1993년 앞은 1993년 값에 조이혼율의 비를 곱해 줄였습니다.</li><li><strong>설계값</strong> 이혼으로 떠난 부모와 같은 쪽 조부모는 다음 해부터 따로 사는 것으로 했습니다. 이혼 뒤 그 집안 조부모와 함께 사는 일은 드물다고 본 설계값입니다.</li><li><strong>확인(환산)</strong> 집의 종류는 인구총조사 거처의 종류별 가구 수(시도별, 1970~2025년)에서 여섯 칸 구성비를 계산했습니다. 전체 가구 기준이라 갓난아이가 있는 가구의 특성은 따로 보정하지 않았습니다.</li><li><strong>추정</strong> 조사한 해 사이는 두 해를 이어 계산하고, 분류가 바뀐 구간(1975→80, 2000→05, 2010→15)은 가까운 해의 값을 썼습니다. 시도 줄이 없던 승격 전 광역시는 부모 도의 줄을 썼습니다.</li><li><strong>설계값</strong> 1969년 이하 출생은 1970년 구성비를 거슬러 썼습니다(건물 종류 표가 없습니다). 아파트는 0.1%, 다세대는 0으로 두고, 주택 이외의 거처는 1940~1999년 출생에서만 나옵니다.</li><li><strong>설계값</strong> 자가, 임차, 무상과 소득계층(수저 단계)은 인구총조사와 주거실태조사의 표를 서로 독립이라고 가정해 곱했습니다. 수저 단계를 소득계층으로 섞는 방법은 출생신고와 같고, 시도를 수도권, 광역시 등, 도지역 세 갈래로 묶은 것은 게임이 정했습니다.</li><li><strong>설계값</strong> 단독주택에 임차로 사는 가구 가운데 셋방인 비율(1990년 앞 85%, 2005년 60%, 2020년 50%)은 통계가 없어 게임이 정했습니다.</li><li><strong>확인(환산)</strong> 방 수는 인구총조사(1980~2010년)의 거처 종류와 가구원 수별 표에서 뽑았습니다. 1980년 앞은 1980년, 2010년 뒤는 2010년 값을 쓰고, 그해에 아주 드문 방 수는 쓰지 않았습니다.</li><li><strong>설계값</strong> 1945년 이전 출생 어머니는 자녀가 많던 시대라, 형제 수가 인구총조사의 평균 출생아 수와 ±0.45명 안에서 맞도록 게임이 값을 조정했습니다.</li><li><strong>설계값</strong> 19세 이하에 부모 한 분이 떠난 해에는 한 번만 건강 −1, 관계 −2, 행복 −8과 집안 살림(아버지 −500만 원, 어머니 −300만 원에 재력 배율 0.8~2.0)이 더해집니다. 통계가 없는 설계값입니다.</li><li><strong>설계값</strong> 아래 동생 수는 출생 순위별 출생 비중에서 유도한 근사이고, 터울 2~5년, 독립 나이 20~30세, 성별은 반반으로 게임이 정했습니다.</li><li><strong>설계값</strong> 식구 이름은 그 사람의 출생 연도에 맞는 이름 풀에서 뽑았습니다. 1940년대보다 앞서 태어난 분(주로 조부모)은 가장 오래된 1940년대 풀을, 2020년 뒤에 태어난 자녀는 가장 최근 풀을 대신 썼고, 1940년대 풀 자체도 통계가 아닌 추정 목록입니다. 성은 아버지 쪽과 형제가 주인공과 같고 어머니와 조모는 따로 뽑았습니다.</li><li><strong>설계값</strong> 부모의 직업은 출생신고에 적힌 값입니다. 은퇴 나이는 농림어업 65~75세, 그 밖 55~65세로 게임이 정했고, 그 나이가 되면 직업 줄이 「은퇴」로 바뀝니다.</li><li><strong>설계값</strong> 형제, 배우자, 자녀, 친구, 조부모의 직업은 통계가 없어, 출생신고의 직업 분포에 시대 보정을 한 값에서 한 번 뽑았습니다. 6~22세는 「학생」으로 봅니다.</li><li><strong>설계값</strong> 배우자, 자녀, 가까운 친구의 수와 나이는 통계가 아니라 게임이 정했습니다. 배우자와의 나이 차는 부모 나이 차와 같은 모양이되 처음 만난 해에 20세 이상이고, 자녀는 첫 자녀를 낳은 시대에 따라 1~4명(경제에는 쓰이지 않고 보이기만 합니다), 터울은 2~5년, 친구는 1~3명입니다.</li><li><strong>설계값</strong> 사이의 다섯 단계(아주 가까움~멀어짐)는 통계가 없습니다. 호칭별 기본값, 부모는 양육 방식, 사람마다 한 단계 안팎의 차이에 더해 사건이 바꾼 것만 반영합니다. 사건 없이 슬며시 바뀌지 않습니다.</li><li><strong>설계값</strong> 반려동물의 이름 목록과 수명(개 10~16년, 고양이 12~18년, 그 밖 2~8년)은 통계가 없어 게임이 정했습니다. 부모 집의 반려동물은 아직 만들지 않고, 사건으로 들인 동물만 보입니다.</li><li><strong>설계값</strong> 집에 있는 것의 보급된 해와 보급 속도는 가구 내구재 보급 통계를 찾아 맞추기 전에 게임이 정한 값입니다. 수저 단계가 높을수록 일찍 들이지만 전체 평균은 이 곡선 그대로입니다. 2025년 뒤에는 새 물건을 만들지 않고, 보급률 숫자는 화면에 쓰지 않습니다.</li></ul></details></section><section class="card peers-now" aria-labelledby="peers-now-t" data-testid="peers-now-card"><div class="card__head card__head--tight"><h2 id="peers-now-t" class="card__title">같은 해 태어난 사람들</h2><span class="card__sub">요즘 모습</span></div><ul class="people" data-testid="peers-now"><li data-testid="peer-now"><div class="people__who"><div class="people__line"><span class="name" data-testid="peer-now-name">박은주</span> <span class="sub">여성</span></div><div class="sub">전라남도(지금의 전남광주통합특별시)</div></div><span class="grade grade--1" data-grade="1"><svg class="spoon" aria-hidden="true" focusable="false"><use href="#sp-1"></use></svg><span>흙수저</span><span class="grade__dots" role="img" aria-label="5단계 중 1단계"><i class="on"></i><i></i><i></i><i></i><i></i></span></span><span class="people__now" data-testid="peer-now-label">학교에 다님</span></li><li data-testid="peer-now"><div class="people__who"><div class="people__line"><span class="name" data-testid="peer-now-name">김현숙</span> <span class="sub">여성</span></div><div class="sub">서울특별시</div></div><span class="grade grade--1" data-grade="1"><svg class="spoon" aria-hidden="true" focusable="false"><use href="#sp-1"></use></svg><span>흙수저</span><span class="grade__dots" role="img" aria-label="5단계 중 1단계"><i class="on"></i><i></i><i></i><i></i><i></i></span></span><span class="people__now" data-testid="peer-now-label">학교에 다님</span></li><li data-testid="peer-now"><div class="people__who"><div class=" ir__probe" data-text="아버지 · 50세" aria-hidden="true"></span>아버지 · <span class="nowrap">50세</span></span></li><li><span class="fit-pair" data-split="false"><span class="fit-pair__probe" data-text="어머니 · 50세" aria-hidden="true"></span>어머니 · <span class="nowrap">50세</span></span></li><li><span class="fit-pair" data-split="false"><span class="fit-pair__probe" data-text="형 · 21세" aria-hidden="true"></span>형 · <span class="nowrap">21세</span></span></li><li data-self="true"><span class="fit-pair" data-split="false"><span class="fit-pair__probe" data-text="나 · 17세" aria-hidden="true"></span>나 · <span class="nowrap">17세</span></span></li><li><span class="fit-pair" data-split="false"><span class="fit-pair__probe" data-text="남동생 · 14세" aria-hidden="true"></span>남동생 · <span class="nowrap">14세</span></span></li><li><span class="fit-pair" data-split="false"><span class="fit-pair__probe" data-text="남동생 · 10세" aria-hidden="true"></span>남동생 · <span class="nowrap">10세</span></span></li><li>그 밖에 1명</li></ul><p class="scene__open"><button type="button" class="btn btn--ghost btn--sm" data-testid="scene-open-family">가족과 삶 열기</button></p></details><button type="button" class="btn btn--ghost btn--sm scene__fold" aria-expanded="true" aria-controls="scene-pic" data-testid="scene-fold">그림 접기</button></div></section><section class="card log" aria-labelledby="log-t" data-testid="log"><div class="card__head card__head--tight"><h2 id="log-t" class="card__title">인생 기록</h2><span class="t-xs t-faint" id="log-hint" data-testid="log-hint"><span class="keep-phrase">최신순 · 아래로</span> 스크롤하면 지난 기록</span></div><div class="log__list" role="region" aria-label="인생 기록" aria-describedby="log-hint" tabindex="0" data-testid="log-list"><ol aria-live="polite" aria-relevant="additions" class="log__rows"><li class="log__row log__row--latest" data-kind="choice" data-testid="log-row"><span class="log__age">16세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">성적표를 받은 저녁, 공부는 어떻게 할까?</span><em class="log__by log__by--parent" data-testid="log-by" data-by="parent"><svg class="icon icon--xs" aria-hidden="true" focusable="false"><use href="#i-by-parent"></use></svg>부모님이 이렇게 정했습니다: 방과 후에 따로 배운다</em><span class="log__result">방과 후마다 따로 공부를 더 했습니다. 숙제가 늘었고, 성적도 꾸준히 올랐습니다.</span></span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">16세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">원서를 쓰는 중학교 마지막 해, 어디로 갈까?</span><em class="log__by log__by--parent" data-testid="log-by" data-by="parent"><svg class="icon icon--xs" aria-hidden="true" focusable="false"><use href="#i-by-parent"></use></svg>부모님이 이렇게 정했습니다: 일을 하며 다닐 수 있는 학교를 고른다</em><span class="log__result">낮에는 일하고 저녁에는 수업을 들었습니다. 졸린 눈으로 받아 적은 공책이 한 권씩 쌓였습니다.</span></span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">16세</span><span class="log__text">외할머니가 76세에 세상을 떠나셨습니다.</span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">14세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">다투고 말이 끊긴 며칠, 어떻게 할까?</span><em>선택: 그 친구와 멀어진다</em><span class="log__result">각자 다른 무리로 흩어졌습니다. 복도에서 마주쳐도 인사만 나눴고, 남는 시간은 공부에 썼습니다.</span></span></li><li class="log__row log__row--tl" data-kind="timeline" data-tl="era" id="log-y1983" tabindex="-1" aria-live="off" data-testid="log-row-era"><span class="log__age">14세<small class="log__year">1983</small></span><span class="log__text"><span class="log__tl"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-era"></use></svg><span>시대의 창</span></span><span class="log__sent">6월, 헤어진 가족을 찾는 생방송이 가을까지 이어졌습니다.</span></span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">13세</span><span class="log__text">8살 위인 누나가 독립해 집을 나섰습니다.</span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">12세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">며칠째 집 앞을 서성이는 강아지, 어떻게 할까?</span><em class="log__by log__by--parent" data-testid="log-by" data-by="parent"><svg class="icon icon--xs" aria-hidden="true" focusable="false"><use href="#i-by-parent"></use></svg>부모님이 이렇게 정했습니다: 집에 들이지는 않고 먹이만 챙겨 주기로 한다</em><span class="log__result">집에 들이지는 않고 남은 밥만 챙겨 주기로 했습니다. 어느 날부터 강아지는 보이지 않았습니다.</span></span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">11세</span><span class="log__text">학교까지는 걸어서 한 시간이 걸렸습니다. 길에서 만난 동무들과 노래를 부르며 걸었습니다.</span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">11세</span><span class="log__text">친할머니가 81세에 세상을 떠나셨습니다.</span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">11세</span><span class="log__text">셋째 동생으로 남동생이 태어났습니다.</span></li><li class="log__row log__row--tl" data-kind="timeline" data-tl="era" id="log-y1980" tabindex="-1" aria-live="off" data-testid="log-row-era"><span class="log__age">11세<small class="log__year">1980</small></span><span class="log__text"><span class="log__tl"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-era"></use></svg><span>시대의 창</span></span><span class="log__sent">5월, 광주에 민주화 시위가 있었습니다.</span></span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">10세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">문방구 앞의 딱지와 구슬, 사 달라고 할까?</span><em>선택: 조른다</em><span class="log__result">며칠을 졸랐지만 어른은 고개를 저었습니다. 문방구 앞을 지날 때마다 걸음이 느려졌습니다.</span></span></li><li class="log__row log__row--tl" data-kind="timeline" data-tl="era" id="log-y1979" tabindex="-1" aria-live="off" data-testid="log-row-era"><span class="log__age">10세<small class="log__year">1979</small></span><span class="log__text"><span class="log__tl"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-era"></use></svg><span>시대의 창</span></span><span class="log__sent">이 해 가을 대통령이 세상을 떠났습니다.</span></span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">8세</span><span class="log__text">아이는 책가방을 메고 처음으로 학교에 갔습니다. 교문 앞에서 몇 번이나 뒤를 돌아보았습니다.</span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">8세</span><span class="log__text">둘째 동생으로 남동생이 태어났습니다.</span></li><li class="log__row log__row--stage" data-kind="stage" data-testid="log-row"><span class="log__age">8세</span><span class="log__text">학교에 들어갈 나이가 되었습니다.</span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">7세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">또래가 다니는 교실과 도장, 보내 달라고 할까?</span><em>선택: 조른다</em><span class="log__result">여러 번 졸랐지만 어른은 고개를 저었습니다. 또래가 배우러 가는 시간이면 혼자 골목에 남았습니다.</span></span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">5세</span><span class="log__text">아이는 눈에 띄는 것마다 이름과 까닭을 물었습니다. 아이의 질문은 하루 종일 끊이지 않았습니다.</span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">5세</span><span class="log__text">외할아버지가 68세에 세상을 떠나셨습니다.</span></li><li class="log__row log__row--tl" data-kind="timeline" data-tl="era" id="log-y1974" tabindex="-1" aria-live="off" data-testid="log-row-era"><span class="log__age">5세<small class="log__year">1974</small></span><span class="log__text"><span class="log__tl"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-era"></use></svg><span>시대의 창</span></span><span class="log__sent">수도권에 지하철이 처음 다녔습니다.</span></span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">4세</span><span class="log__text">남동생이 태어났습니다.</span></li><li class="log__row log__row--tl" data-kind="timeline" data-tl="era" id="log-y1973" tabindex="-1" aria-live="off" data-testid="log-row-era"><span class="log__age">4세<small class="log__year">1973</small></span><span class="log__text"><span class="log__tl"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-era"></use></svg><span>시대의 창</span></span><span class="log__sent">10월, 기름값이 크게 올라 물가가 뛰기 시작했습니다.</span></span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">3세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">일하러 나간 낮, 어디에 맡길까?</span><em class="log__by log__by--parent" data-testid="log-by" data-by="parent"><svg class="icon icon--xs" aria-hidden="true" focusable="false"><use href="#i-by-parent"></use></svg>부모님이 이렇게 정했습니다: 아이를 돌봐 주는 곳에 보낸다</em><span class="log__result">또래 아이들과 하루를 보내기 시작했습니다. 처음 몇 주는 아침마다 울었지만 차츰 익숙해졌습니다.</span></span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">2세</span><span class="log__text">겨울이면 온 식구가 아랫목에 모여 잤습니다. 밤새 연탄불이 꺼지지 않게 어른들이 번갈아 일어났습니다.</span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">2세</span><span class="log__text">아이가 처음으로 낱말 하나를 말했습니다. 곁에 있던 어른들이 한참을 웃었습니다.</span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">2세</span><span class="log__text">아이가 붙잡고 서더니 처음으로 혼자 몇 걸음을 걸었습니다. 모두가 숨을 죽였습니다.</span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">1세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">처음 먹는 밥, 무엇을 먹일까?</span><em class="log__by log__by--parent" data-testid="log-by" data-by="parent"><svg class="icon icon--xs" aria-hidden="true" focusable="false"><use href="#i-by-parent"></use></svg>부모님이 이렇게 정했습니다: 남이 만든 것을 사다 먹인다</em><span class="log__result">남이 만든 것을 사다 먹이며 끼니를 해결했습니다. 아이가 먹는 동안 어른들도 한숨 돌렸습니다.</span></span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">1세</span><span class="log__text">첫 예방 주사를 맞던 날, 아이는 크게 울었습니다. 어른들은 아이를 안아 달랜 뒤 집으로 돌아왔습니다.</span></li><li class="log__row log__row--tl" data-kind="timeline" data-tl="era" id="log-y1970" tabindex="-1" aria-live="off" data-testid="log-row-era"><span class="log__age">1세<small class="log__year">1970</small></span><span class="log__text"><span class="log__tl"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-era"></use></svg><span>시대의 창</span></span><span class="log__sent">7월, 서울과 부산을 잇는 고속도로가 뚫렸습니다.</span></span></li><li class="log__row log__row--stage" data-kind="stage" data-testid="log-row"><span class="log__age">1세</span><span class="log__text">1970년 12월, 충청남도의 넉넉하지는 않은 가정에서 3.3kg 남자아이로 태어났습니다. 셋째입니다. (3.3kg은 상위 약 40%)</span></li></ol></div></section></div><div class="col col--right"><section class="card era-card" id="era-card" aria-labelledby="era-title" data-testid="era-card" data-paired="true" style="--era-card-h: 303px;"><h2 id="era-title" class="card__title card__title--gap">시대의 창</h2><div class="era" id="scene-era" data-empty="true" data-hidden="false"><span class="era__pic era__pic--empty" aria-hidden="true"><i class="era__sheet"></i></span></div></section><section class="card family" aria-labelledby="family-t" data-testid="family-card"><h2 id="family-t" class="card__title card__title--gap" tabindex="-1">식구</h2><dl class="family-list" data-testid="family-list"><dt>어머니</dt><dd data-testid="family-mother" data-state="with"><span class="family-who">최정순 50세</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="아주 가까움 · 사무직" aria-hidden="true"></span>아주 가까움 · 사무직</span></small></dd><dt>아버지</dt><dd data-testid="family-father" data-state="with"><span class="family-who">임태수 50세</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="아주 가까움 · 전문직" aria-hidden="true"></span>아주 가까움 · 전문직</span></small></dd><dt>형</dt><dd data-testid="family-sibling" data-state="with"><span class="family-who">임병철 21세</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="데면데면함 · 학생" aria-hidden="true"></span>데면데면함 · 학생</span></small></dd><dt>남동생</dt><dd data-testid="family-sibling" data-state="with"><span class="family-who">임성훈 14세</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="가까움 · 학생" aria-hidden="true"></span>가까움 · 학생</span></small></dd><dt>남동생</dt><dd data-testid="family-sibling" data-state="with"><span class="family-who">임상철 10세</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="데면데면함 · 학생" aria-hidden="true"></span>데면데면함 · 학생</span></small></dd><dt>남동생</dt><dd data-testid="family-sibling" data-state="with"><span class="family-who">임민석 7세</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="보통 · 학생" aria-hidden="true"></span>보통 · 학생</span></small></dd><dt>누나</dt><dd data-testid="family-sibling" data-state="apart"><span class="family-who">임영순 25세</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="가까움 · 단순노무직 · 따로 삶" aria-hidden="true"></span>가까움 · 단순노무직 · 따로 삶</span></small></dd></dl><h3 class="family-sub">집에 있는 것</h3><p class="family-things" data-testid="family-things"><span class="nowrap">컬러 텔레비전</span>, <span class="nowrap">세탁기</span>, <span class="nowrap">유선 전화</span>, <span class="nowrap">냉장고</span>, <span class="nowrap">선풍기</span>, <span class="nowrap">라디오</span></p><h3 class="family-sub">떠난 가족</h3><dl class="family-list family-list--gone" data-testid="family-gone"><dt>친할아버지</dt><dd data-testid="family-grandparent" data-state="gone"><span class="family-who">임광수</span><small><span class="fit-pair fit-pair--flow is-split" data-split="true"><span class="fit-pair__probe" data-text="내가 태어나기 전에 세상을 떠남(51세)" aria-hidden="true"></span><span class="fit-pair__item">내가 태어나기 전에 세상을 <span class="keep-phrase">떠남(<span class="nowrap">51세</span>)</span></span></span></small></dd><dt>친할머니</dt><dd data-testid="family-grandparent" data-state="gone"><span class="family-who">정미자</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="81세에 세상을 떠남" aria-hidden="true"></span><span class="nowrap">81세에</span> 세상을 떠남</span></small></dd><dt>외할아버지</dt><dd data-testid="family-grandparent" data-state="gone"><span class="family-who">최영식</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="68세에 세상을 떠남" aria-hidden="true"></span><span class="nowrap">68세에</span> 세상을 떠남</span></small></dd><dt>외할머니</dt><dd data-testid="family-grandparent" data-state="gone"><span class="family-who">김옥자</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="76세에 세상을 떠남" aria-hidden="true"></span><span class="nowrap">76세에</span> 세상을 떠남</span></small></dd></dl><button type="button" class="btn btn--ghost btn--sm family-more" aria-expanded="false" data-testid="family-more">더 보기</button><details class="disclosure family-basis" data-testid="family-basis"><summary>이 칸은 어떻게 정했나요</summary><p>식구의 이름, 나이, 사이, 직업과 집에 있는 것은 통계와 게임이 정한 값이 섞여 있습니다. 칸마다 어디까지가 통계인지 밝힙니다.</p><ul><li><strong>확인</strong> 식구가 몇 살까지 사셨는지는 통계청 간이생명표(1970~2024년)의 나이대별 사망확률로 정했습니다. 2024년 뒤에는 2024년 값을 그대로 씁니다.</li><li><strong>추정</strong> 1970년 앞의 생명표는 없어서, 1970년 값에 배율을 곱해 기대수명이 1970년대 추세선을 거꾸로 이은 값이 되게 맞췄습니다(30세 아래로는 내리지 않았습니다).</li><li><strong>확인</strong> 어머니가 아이를 낳은 나이는 인구동향조사의 연령별 출생아 구성비(1981~2025년)를 썼습니다.</li><li><strong>확인(환산)</strong> 1956~1980년은 인구총조사의 어머니 연령별 자녀 수를 거슬러 계산했습니다(오차 ±0.5세).</li><li><strong>추정</strong> 1956년 앞 출생은 1966년 인구총조사 표본의 출산 어머니 나이 분포(평균 29.7세)를 그대로 거슬러 썼습니다. 한 해의 분포를 앞 시대에 이은 추정입니다.</li><li><strong>확인(환산)</strong> 조부모와 함께 사는 비율은 인구총조사의 아동 가구 세대 구성(2000년과 2005년)에서 계산했습니다.</li><li><strong>추정</strong> 그 밖의 해는 3세대 이상 가구 비율에 1.85를 곱해 이었습니다(2000년과 2005년의 실제 배율 1.73과 1.99의 가운데).</li><li><strong>설계값</strong> 함께 사는 조부모가 친가인지 외가인지는 통계가 없어 친가 70%, 외가 30%로 정했습니다.</li><li><strong>확인(환산)</strong> 부모의 이혼은 이혼 건수에 미성년 자녀 수의 하한을 곱해 미성년 인구로 나눈 근사입니다(1993~2025년).</li><li><strong>추정</strong> 1993년 앞은 1993년 값에 조이혼율의 비를 곱해 줄였습니다.</li><li><strong>설계값</strong> 이혼으로 떠난 부모와 같은 쪽 조부모는 다음 해부터 따로 사는 것으로 했습니다. 이혼 뒤 그 집안 조부모와 함께 사는 일은 드물다고 본 설계값입니다.</li><li><strong>확인(환산)</strong> 집의 종류는 인구총조사 거처의 종류별 가구 수(시도별, 1970~2025년)에서 여섯 칸 구성비를 계산했습니다. 전체 가구 기준이라 갓난아이가 있는 가구의 특성은 따로 보정하지 않았습니다.</li><li><strong>추정</strong> 조사한 해 사이는 두 해를 이어 계산하고, 분류가 바뀐 구간(1975→80, 2000→05, 2010→15)은 가까운 해의 값을 썼습니다. 시도 줄이 없던 승격 전 광역시는 부모 도의 줄을 썼습니다.</li><li><strong>설계값</strong> 1969년 이하 출생은 1970년 구성비를 거슬러 썼습니다(건물 종류 표가 없습니다). 아파트는 0.1%, 다세대는 0으로 두고, 주택 이외의 거처는 1940~1999년 출생에서만 나옵니다.</li><li><strong>설계값</strong> 자가, 임차, 무상과 소득계층(수저 단계)은 인구총조사와 주거실태조사의 표를 서로 독립이라고 가정해 곱했습니다. 수저 단계를 소득계층으로 섞는 방법은 출생신고와 같고, 시도를 수도권, 광역시 등, 도지역 세 갈래로 묶은 것은 게임이 정했습니다.</li><li><strong>설계값</strong> 단독주택에 임차로 사는 가구 가운데 셋방인 비율(1990년 앞 85%, 2005년 60%, 2020년 50%)은 통계가 없어 게임이 정했습니다.</li><li><strong>확인(환산)</strong> 방 수는 인구총조사(1980~2010년)의 거처 종류와 가구원 수별 표에서 뽑았습니다. 1980년 앞은 1980년, 2010년 뒤는 2010년 값을 쓰고, 그해에 아주 드문 방 수는 쓰지 않았습니다.</li><li><strong>설계값</strong> 1945년 이전 출생 어머니는 자녀가 많던 시대라, 형제 수가 인구총조사의 평균 출생아 수와 ±0.45명 안에서 맞도록 게임이 값을 조정했습니다.</li><li><strong>설계값</strong> 19세 이하에 부모 한 분이 떠난 해에는 한 번만 건강 −1, 관계 −2, 행복 −8과 집안 살림(아버지 −500만 원, 어머니 −300만 원에 재력 배율 0.8~2.0)이 더해집니다. 통계가 없는 설계값입니다.</li><li><strong>설계값</strong> 아래 동생 수는 출생 순위별 출생 비중에서 유도한 근사이고, 터울 2~5년, 독립 나이 20~30세, 성별은 반반으로 게임이 정했습니다.</li><li><strong>설계값</strong> 식구 이름은 그 사람의 출생 연도에 맞는 이름 풀에서 뽑았습니다. 1940년대보다 앞서 태어난 분(주로 조부모)은 가장 오래된 1940년대 풀을, 2020년 뒤에 태어난 자녀는 가장 최근 풀을 대신 썼고, 1940년대 풀 자체도 통계가 아닌 추정 목록입니다. 성은 아버지 쪽과 형제가 주인공과 같고 어머니와 조모는 따로 뽑았습니다.</li><li><strong>설계값</strong> 부모의 직업은 출생신고에 적힌 값입니다. 은퇴 나이는 농림어업 65~75세, 그 밖 55~65세로 게임이 정했고, 그 나이가 되면 직업 줄이 「은퇴」로 바뀝니다.</li><li><strong>설계값</strong> 형제, 배우자, 자녀, 친구, 조부모의 직업은 통계가 없어, 출생신고의 직업 분포에 시대 보정을 한 값에서 한 번 뽑았습니다. 6~22세는 「학생」으로 봅니다.</li><li><strong>설계값</strong> 배우자, 자녀, 가까운 친구의 수와 나이는 통계가 아니라 게임이 정했습니다. 배우자와의 나이 차는 부모 나이 차와 같은 모양이되 처음 만난 해에 20세 이상이고, 자녀는 첫 자녀를 낳은 시대에 따라 1~4명(경제에는 쓰이지 않고 보이기만 합니다), 터울은 2~5년, 친구는 1~3명입니다.</li><li><strong>설계값</strong> 사이의 다섯 단계(아주 가까움~멀어짐)는 통계가 없습니다. 호칭별 기본값, 부모는 양육 방식, 사람마다 한 단계 안팎의 차이에 더해 사건이 바꾼 것만 반영합니다. 사건 없이 슬며시 바뀌지 않습니다.</li><li><strong>설계값</strong> 반려동물의 이름 목록과 수명(개 10~16년, 고양이 12~18년, 그 밖 2~8년)은 통계가 없어 게임이 정했습니다. 부모 집의 반려동물은 아직 만들지 않고, 사건으로 들인 동물만 보입니다.</li><li><strong>설계값</strong> 집에 있는 것의 보급된 해와 보급 속도는 가구 내구재 보급 통계를 찾아 맞추기 전에 게임이 정한 값입니다. 수저 단계가 높을수록 일찍 들이지만 전체 평균은 이 곡선 그대로입니다. 2025년 뒤에는 새 물건을 만들지 않고, 보급률 숫자는 화면에 쓰지 않습니다.</li></ul></details></section><section class="card peers-now" aria-labelledby="peers-now-t" data-testid="peers-now-card"><div class="card__head card__head--tight"><h2 id="peers-now-t" class="card__title">같은 해 태어난 사람들</h2><span class="card__sub">요즘 모습</span></div><ul class="people" data-testid="peers-now"><li data-testid="peer-now"><div class="people__who"><div class="people__line"><span class="name" data-testid="peer-now-name">박은주</span> <span class="sub">여성</span></div><div class="sub">전라남도(지금의 전남광주통합특별시)</div></div><span class="grade grade--1" data-grade="1"><svg class="spoon" aria-hidden="true" focusable="false"><use href="#sp-1"></use></svg><span>흙수저</span><span class="grade__dots" role="img" aria-label="5단계 중 1단계"><i class="on"></i><i></i><i></i><i></i><i></i></span></span><span class="people__now" data-testid="peer-now-label">학교에 다님</span></li><li data-testid="peer-now"><div class="people__who"><div class="people__line"><span class="name" data-testid="peer-now-name">김현숙</span> <span class="sub">여성</span></div><div class="sub">서울특별시</div></div><span class="grade grade--1" data-grade="1"><svg class="spoon" aria-hidden="true" focusable="false"><use href="#sp-1"></use></svg><span>흙수저</span><span class="grade__dots" role="img" aria-label="5단계 중 1단계"><i class="on"></i><i></i><i></i><i></i><i></i></span></span><span class="people__now" data-testid="peer-now-label">학교에 다님</span></li><li /button></p></details><button type="button" class="btn btn--ghost btn--sm scene__fold" aria-expanded="true" aria-controls="scene-pic" data-testid="scene-fold">그림 접기</button></div></section><section class="card log" aria-labelledby="log-t" data-testid="log"><div class="card__head card__head--tight"><h2 id="log-t" class="card__title">인생 기록</h2><span class="t-xs t-faint" id="log-hint" data-testid="log-hint"><span class="keep-phrase">최신순 · 아래로</span> 스크롤하면 지난 기록</span></div><div class="log__list" role="region" aria-label="인생 기록" aria-describedby="log-hint" tabindex="0" data-testid="log-list"><ol aria-live="polite" aria-relevant="additions" class="log__rows"><li class="log__row log__row--stage log__row--latest" data-kind="stage" data-testid="log-row"><span class="log__age">41세</span><span class="log__text">어느덧 마흔을 넘겼습니다.</span></li><li class="log__row log__row--tl" data-kind="timeline" data-tl="era" id="log-y2010" tabindex="-1" aria-live="off" data-testid="log-row-era"><span class="log__age">41세<small class="log__year">2010</small></span><span class="log__text"><span class="log__tl"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-era"></use></svg><span>시대의 창</span></span><span class="log__sent">스마트폰이 퍼져 거리에서 화면을 보는 사람이 늘었습니다. <span class="log__second" data-testid="log-second">집에서는 약정이 끝날 때까지 옛 전화를 썼습니다.</span></span></span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">40세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">함께 산 지 몇 해, 아이를 가질까 말까?</span><em>선택: 조금 더 기다리기로 한다</em><span class="log__result">형편이 나아지면 생각하기로 했습니다. 시간은 소리 없이 지나갔고, 둘은 서로에게 더 기댔습니다.</span></span></li><li class="log__row log__row--tl" data-kind="timeline" data-tl="era" id="log-y2009" tabindex="-1" aria-live="off" data-testid="log-row-era"><span class="log__age">40세<small class="log__year">2009</small></span><span class="log__text"><span class="log__tl"><svg class="icon" aria-hidden="true" focusable="fal idden="true"></span>아주 가까움 · 은퇴 · 따로 삶</span></small></dd><dt>형</dt><dd data-testid="family-sibling" data-state="apart"><span class="family-who">임병철 45세</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="데면데면함 · 전문직 · 따로 삶" aria-hidden="true"></span>데면데면함 · 전문직 · 따로 삶</span></small></dd><dt>누나</dt><dd data-testid="family-sibling" data-state="apart"><span class="family-who">임영순 49세</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="가까움 · 단순노무직 · 따로 삶" aria-hidden="true"></span>가까움 · 단순노무직 · 따로 삶</span></small></dd><dt>남동생</dt><dd data-testid="family-sibling" data-state="apart"><span class="family-who">임성훈 38세</span><small><span class="fit-pair fit-pair--flow is-split" data-split="true"><span class="fit-pair__probe" data-text="가까움 · 기계 조작직 · 따로 삶" aria-hidden="true"></span><span class="fit-pair__item">가까움,</span> <span class="fit-pair__item">기계 조작직,</span> <span class="fit-pair__item">따로 삶</span></span></small></dd><dt>남동생</dt><dd data-testid="family-sibling" data-state="apart"><span class="family-who">임상철 34세</span><small><span class="fit-pair fit-pair--flow is-split" data-split="true"><span class="fit-pair__probe" data-text="데면데면함 · 기계 조작직 · 따로 삶" aria-hidden="true"></span><span class="fit-pair__item">데면데면함,</span> <span class="fit-pair__item">기계 조작직,</span> <span class="fit-pair__item">따로 삶</span></span></small></dd><dt>남동생</dt><dd data-testid="family-sibling" data-state="apart"><span class="family-who">임민석 31세</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="보통 · 전문직 · 따로 삶" aria-hidden="true"></span>보통 · 전문직 · 따로 삶</span></small></dd><dt>배우자</dt><dd data-testid="family-spouse" data-state="with"><span class="family-who">김미란 39세</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="가까움 · 서비스직" aria-hidden="true"></span>가까움 · 서비스직</span></small></dd></dl><h3 class="family-sub">집에 있는 것</h3><p class="family-things" data-testid="family-things"><span class="nowrap">에어컨</span>, <span class="nowrap">인터넷</span>, <span class="nowrap">휴대전화</span>, <span class="nowrap">컴퓨터</span>, <span class="nowrap">전자레인지</span>, <span class="nowrap">승용차</span>, <span class="nowrap">컬러 텔레비전</span>, <span class="nowrap">세탁기</span></p><h3 class="family-sub">떠난 가족</h3><dl class="family-list family-list--gone" data-testid="family-gone"><dt>어머니</dt><dd data-testid="family-mother" data-state="gone"><span class="family-who">최정순</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="69세에 세상을 떠남" aria-hidden="true"></span><span class="nowrap">69세에</span> 세상을 떠남</span></small></dd><dt>친할아버지</dt><dd data-testid="family-grandparent" data-state="gone"><span class="family-who">임광수</span><small><span class="fit-pair fit-pair--flow is-split" data-split="true"><span class="fit-pair__probe" data-text="내가 태어나기 전에 세상을 떠남(51세)" aria-hidden="true"></span><span class="fit-pair__item">내가 태어나기 전에 세상을 <span class="keep-phrase">떠남(<span class="nowrap">51세</span>)</span></span></span></small></dd><dt>친할머니</dt><dd data-testid="family-grandparent" data-state="gone"><span class="family-who">정미자</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="81세에 세상을 떠남" aria-hidden="true"></span><span class="nowrap">81세에</span> 세상을 떠남</span></small></dd><dt>외할아버지</dt><dd data-testid="family-grandparent" data-state="gone"><span class="family-who">최영식</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="68세에 세상을 떠남" aria-hidden="true"></span><span class="nowrap">68세에</span> 세상을 떠남</span></small></dd><dt>외할머니</dt><dd data-testid="family-grandparent" data-state="gone"><span class="family-who">김옥자</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="76세에 세상을 떠남" aria-hidden="true"></span><span class="nowrap">76세에</span> 세상을 떠남</span></small></dd></dl><button type="button" class="btn btn--ghost btn--sm family-more" aria-expanded="false" data-testid="family-more">더 보기</button><details class="disclosure family-basis" data-testid="family-basis"><summary>이 칸은 어떻게 정했나요</summary><p>식구의 이름, 나이, 사이, 직업과 집에 있는 것은 통계와 게임이 정한 값이 섞여 있습니다. 칸마다 어디까지가 통계인지 밝힙니다.</p><ul><li><strong>확인</strong> 식구가 몇 살까지 사셨는지는 통계청 간이생명표(1970~2024년)의 나이대별 사망확률로 정했습니다. 2024년 뒤에는 2024년 값을 그대로 씁니다.</li><li><strong>추정</strong> 1970년 앞의 생명표는 없어서, 1970년 값에 배율을 곱해 기대수명이 1970년대 추세선을 거꾸로 이은 값이 되게 맞췄습니다(30세 아래로는 내리지 않았습니다).</li><li><strong>확인</strong> 어머니가 아이를 낳은 나이는 인구동향조사의 연령별 출생아 구성비(1981~2025년)를 썼습니다.</li><li><strong>확인(환산)</strong> 1956~1980년은 인구총조사의 어머니 연령별 자녀 수를 거슬러 계산했습니다(오차 ±0.5세).</li><li><strong>추정</strong> 1956년 앞 출생은 1966년 인구총조사 표본의 출산 어머니 나이 분포(평균 29.7세)를 그대로 거슬러 썼습니다. 한 해의 분포를 앞 시대에 이은 추정입니다.</li><li><strong>확인(환산)</strong> 조부모와 함께 사는 비율은 인구총조사의 아동 가구 세대 구성(2000년과 2005년)에서 계산했습니다.</li><li><strong>추정</strong> 그 밖의 해는 3세대 이상 가구 비율에 1.85를 곱해 이었습니다(2000년과 2005년의 실제 배율 1.73과 1.99의 가운데).</li><li><strong>설계값</strong> 함께 사는 조부모가 친가인지 외가인지는 통계가 없어 친가 70%, 외가 30%로 정했습니다.</li><li><strong>확인(환산)</strong> 부모의 이혼은 이혼 건수에 미성년 자녀 수의 하한을 곱해 미성년 인구로 나눈 근사입니다(1993~2025년).</li><li><strong>추정</strong> 1993년 앞은 1993년 값에 조이혼율의 비를 곱해 줄였습니다.</li><li><strong>설계값</strong> 이혼으로 떠난 부모와 같은 쪽 조부모는 다음 해부터 따로 사는 것으로 했습니다. 이혼 뒤 그 집안 조부모와 함께 사는 일은 드물다고 본 설계값입니다.</li><li><strong>확인(환산)</strong> 집의 종류는 인구총조사 거처의 종류별 가구 수(시도별, 1970~2025년)에서 여섯 칸 구성비를 계산했습니다. 전체 가구 기준이라 갓난아이가 있는 가구의 특성은 따로 보정하지 않았습니다.</li><li><strong>추정</strong> 조사한 해 사이는 두 해를 이어 계산하고, 분류가 바뀐 구간(1975→80, 2000→05, 2010→15)은 가까운 해의 값을 썼습니다. 시도 줄이 없던 승격 전 광역시는 부모 도의 줄을 썼습니다.</li><li><strong>설계값</strong> 1969년 이하 출생은 1970년 구성비를 거슬러 썼습니다(건물 종류 표가 없습니다). 아파트는 0.1%, 다세대는 0으로 두고, 주택 이외의 거처는 1940~1999년 출생에서만 나옵니다.</li><li><strong>설계값</strong> 자가, 임차, 무상과 소득계층(수저 단계)은 인구총조사와 주거실태조사의 표를 서로 독립이라고 가정해 곱했습니다. 수저 단계를 소득계층으로 섞는 방법은 출생신고와 같고, 시도를 수도권, 광역시 등, 도지역 세 갈래로 묶은 것은 게임이 정했습니다.</li><li><strong>설계값</strong> 단독주택에 임차로 사는 가구 가운데 셋방인 비율(1990년 앞 85%, 2005년 60%, 2020년 50%)은 통계가 없어 게임이 정했습니다.</li><li><strong>확인(환산)</strong> 방 수는 인구총조사(1980~2010년)의 거처 종류와 가구원 수별 표에서 뽑았습니다. 1980년 앞은 1980년, 2010년 뒤는 2010년 값을 쓰고, 그해에 아주 드문 방 수는 쓰지 않았습니다.</li><li><strong>설계값</strong> 1945년 이전 출생 어머니는 자녀가 많던 시대라, 형제 수가 인구총조사의 평균 출생아 수와 ±0.45명 안에서 맞도록 게임이 값을 조정했습니다.</li><li><strong>설계값</strong> 19세 이하에 부모 한 분이 떠난 해에는 한 번만 건강 −1, 관계 −2, 행복 −8과 집안 살림(아버지 −500만 원, 어머니 −300만 원에 재력 배율 0.8~2.0)이 더해집니다. 통계가 없는 설계값입니다.</li><li><strong>설계값</strong> 아래 동생 수는 출생 순위별 출생 비중에서 유도한 근사이고, 터울 2~5년, 독립 나이 20~30세, 성별은 반반으로 게임이 정했습니다.</li><li><strong>설계값</strong> 식구 이름은 그 사람의 출생 연도에 맞는 이름 풀에서 뽑았습니다. 1940년대보다 앞서 태어난 분(주로 조부모)은 가장 오래된 1940년대 풀을, 2020년 뒤에 태어난 자녀는 가장 최근 풀을 대신 썼고, 1940년대 풀 자체도 통계가 아닌 추정 목록입니다. 성은 아버지 쪽과 형제가 주인공과 같고 어머니와 조모는 따로 뽑았습니다.</li><li><strong>설계값</strong> 부모의 직업은 출생신고에 적힌 값입니다. 은퇴 나이는 농림어업 65~75세, 그 밖 55~65세로 게임이 정했고, 그 나이가 되면 직업 줄이 「은퇴」로 바뀝니다.</li><li><strong>설계값</strong> 형제, 배우자, 자녀, 친구, 조부모의 직업은 통계가 없어, 출생신고의 직업 분포에 시대 보정을 한 값에서 한 번 뽑았습니다. 6~22세는 「학생」으로 봅니다.</li><li><strong>설계값</strong> 배우자, 자녀, 가까운 친구의 수와 나이는 통계가 아니라 게임이 정했습니다. 배우자와의 나이 차는 부모 나이 차와 같은 모양이되 처음 만난 해에 20세 이상이고, 자녀는 첫 자녀를 낳은 시대에 따라 1~4명(경제에는 쓰이지 않고 보이기만 합니다), 터울은 2~5년, 친구는 1~3명입니다.</li><li><strong>설계값</strong> 사이의 다섯 단계(아주 가까움~멀어짐)는 통계가 없습니다. 호칭별 기본값, 부모는 양육 방식, 사람마다 한 단계 안팎의 차이에 더해 사건이 바꾼 것만 반영합니다. 사건 없이 슬며시 바뀌지 않습니다.</li><li><strong>설계값</strong> 반려동물의 이름 목록과 수명(개 10~16년, 고양이 12~18년, 그 밖 2~8년)은 통계가 없어 게임이 정했습니다. 부모 집의 반려동물은 아직 만들지 않고, 사건으로 들인 동물만 보입니다.</li><li><strong>설계값</strong> 집에 있는 것의 보급된 해와 보급 속도는 가구 내구재 보급 통계를 찾아 맞추기 전에 게임이 정한 값입니다. 수저 단계가 높을수록 일찍 들이지만 전체 평균은 이 곡선 그대로입니다. 2025년 뒤에는 새 물건을 만들지 않고, 보급률 숫자는 화면에 쓰지 않습니다.</li></ul></details></section><section class="card peers-now" aria-labelledby="peers-now-t" data-testid="peers-now-card"><div class="card__head card__head--tight"><h2 id="peers-now-t" class="card__title">같은 해 태어난 사람들</h2><span class="card__sub">요즘 모습</span></div><ul class="people" data-testid="peers-now"><li data-testid="peer-now"><div class="people__who"><div class="people__line"><span class="name" data-testid="peer-now-name">박은주</span> <span class="sub">여성</span></div><div class="sub">전라남도(지금의 전남광주통합특별시)</div></div><span class="grade grade--1" data-grade="1"><svg class="spoon" aria-hidden="true" focusable="false"><use href="#sp-1"></use></svg><span>흙수저</span><span class="grade__dots" role="img" aria-label="5단계 중 1단계"><i class="on"></i><i></i><i></i><i></i><i></i></span></span><span class="people__now" data-testid="peer-now-label">돌봄</span></li><li data-testid="peer-now"><div class="people__who"><div class="people__line"><span class="name" data-testid="peer-now-name">김현숙</span> <span class="sub">여성</span></div><div class="sub">서울특별시</div></div><span class="grade grade--1" data-grade="1"><svg class="spoon" aria-hidden="true" focusable="false"><use href="#sp-1"></use></svg><span>흙수저</span><span class="grade__dots" role="img" aria-label="5단계 중 1단계"><i class="on"></i><i></i><i></i><i></i><i></i></span></span><span class="people__now" data-testid="peer-now-label">일하는 사람</span></li><li data-testid="peer-now"><div class="people__who"><div class="people__line"><span class="name" data-testid="peer-now-name">이성수</span> <span class="sub">남성</span></div><div class="sub">서울특별시</div></div><span class="grade grade--1" data-grade="1"><svg class="spoon" aria-hidden="true" focusable="false"><use href="#sp-1"></use></svg><span>흙수저</span><span class="grade__dots" role="img" aria-label="5단계 중 1단계"><i class="on"></i><i></i><i></i><i></i><i></i></span></span><span class="people__now" data-testid="peer-now-label">일하는 사람</span></li><li data-testid="peer-now"><div class="people__who"><div class="people__line"><span class="name" data-testid="peer-now-name">김성호</span> <span class="sub">남성</span></div><div class="sub">충청북도</div></div><span class="grade grade--2" data-grade="2"><svg class="spoon" aria-hidd d="log-row-era"><span class="log__age">40세<small class="log__year">2009</small></span><span class="log__text"><span class="log__tl"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-era"></use></svg><span>시대의 창</span></span><span class="log__sent">5월, 광장에 조문 줄이 길었습니다.</span></span></li><li class="log__row log__row--tl" data-kind="timeline" data-tl="era" id="log-y2008" tabindex="-1" aria-live="off" data-testid="log-row-era"><span class="log__age">39세<small class="log__year">2008</small></span><span class="log__text"><span class="log__tl"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-era"></use></svg><span>시대의 창</span></span><span class="log__sent">9월, 미국에서 시작된 금융위기가 온 세계로 번졌습니다. <span class="log__second" data-testid="log-second">집에서는 일감이 줄어 씀씀이를 더 줄였습니다.</span></span></span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">37세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">지난번 미뤄 둔 이야기, 이번에는 어떻게 할까?</span><em>선택: 이번에는 함께 살기로 한다</em><span class="log__result">작게 식을 올렸습니다. 늦었다고 생각했지만 늦은 만큼 서로를 잘 알고 있었습니다.</span></span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">36세</span><span class="log__text">어머니가 69세에 세상을 떠나셨습니다.</span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">34세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">슬슬 나오는 결혼 이야기, 어떻게 받을까?</span><em>선택: 조금 더 기다리자고 말한다</em><span class="log__result">서두르지 않기로 했습니다. 몸과 마음의 짐은 덜었지만 상대의 얼굴에 아쉬운 기색이 스쳤습니다.</span></span></li><li class="log__row log__row--tl" data-kind="timeline" data-tl="era" id="log-y2003" tabindex="-1" aria-live="off" data-testid="log-row-era"><span class="log__age">34세<small class="log__year">2003</small></span><span class="log__text"><span class="log__tl"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-era"></use></svg><span>시대의 창</span></span><span class="log__sent">지하철역에서 큰불이 났습니다.</span></span></li><li class="log__row log__row--tl" data-kind="timeline" data-tl="era" id="log-y2002" tabindex="-1" aria-live="off" data-testid="log-row-era"><span class="log__age">33세<small class="log__year">2002</small></span><span class="log__text"><span class="log__tl"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-era"></use></svg><span>시대의 창</span></span><span class="log__sent">우리나라가 월드컵 4강에 올라 온 나라가 떠들썩했습니다.</span></span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">32세</span><span class="log__text">일은 끝이 없었습니다. 퇴근한 뒤에도 연락이 이어졌고, 쉬는 날에도 마음 한쪽은 일터에 남아 있었습니다.</span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">31세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">어른들이 마련한 맞선 자리, 응할까 말까?</span><em>선택: 맞선 자리에 나간다</em><span class="log__result">어색한 인사를 나누고 몇 번 더 만났습니다. 어른들은 일이 빠르게 진행되기를 바랐습니다.</span></span></li><li class="log__row log__row--tl" data-kind="timeline" data-tl="era" id="log-y1999" tabindex="-1" aria-live="off" data-testid="log-row-era"><span class="log__age">30세<small class="log__year">1999</small></span><span class="log__text"><span class="log__tl"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-era"></use></svg><span>시대의 창</span></span><span class="log__sent">새천년을 맞는 밤, 거리마다 사람들이 모였습니다.</span></span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">29세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">이어지는 상사의 부당한 지시, 어떻게 할까?</span><em>선택: 다른 곳을 알아본다</em><span class="log__result">몇 달 뒤 새 직장으로 옮겼습니다. 낯선 곳이었지만 굳었던 어깨가 풀리는 기분이 들었습니다.</span></span></li><li class="log__row log__row--tl" data-kind="timeline" data-tl="era" id="log-y1998" tabindex="-1" aria-live="off" data-testid="log-row-era"><span class="log__age">29세<small class="log__year">1998</small></span><span class="log__text" ass="log__q" data-testid="log-q">원서를 쓰는 중학교 마지막 해, 어디로 갈까?</span><em class="log__by log__by--parent" data-testid="log-by" data-by="parent"><svg class="icon icon--xs" aria-hidden="true" focusable="false"><use href="#i-by-parent"></use></svg>부모님이 이렇게 정했습니다: 일을 하며 다닐 수 있는 학교를 고른다</em><span class="log__result">낮에는 일하고 저녁에는 수업을 들었습니다. 졸린 눈으로 받아 적은 공책이 한 권씩 쌓였습니다.</span></span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">16세</span><span class="log__text">외할머니가 76세에 세상을 떠나셨습니다.</span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">14세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">다투고 말이 끊긴 며칠, 어떻게 할까?</span><em>선택: 그 친구와 멀어진다</em><span class="log__result">각자 다른 무리로 흩어졌습니다. 복도에서 마주쳐도 인사만 나눴고, 남는 시간은 공부에 썼습니다.</span></span></li><li class="log__row log__row--tl" data-kind="timeline" data-tl="era" id="log-y1983" tabindex="-1" aria-live="off" data-testid="log-row-era"><span class="log__age">14세<small class="log__year">1983</small></span><span class="log__text"><span class="log__tl"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-era"></use></svg><span>시대의 창</span></span><span class="log__sent">6월, 헤어진 가족을 찾는 생방송이 가을까지 이어졌습니다.</span></span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">13세</span><span class="log__text">8살 위인 누나가 독립해 집을 나섰습니다.</span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">12세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">며칠째 집 앞을 서성이는 강아지, 어떻게 할까?</span><em class="log__by log__by--parent" data-testid="log-by" data-by="parent"><svg class="icon icon--xs" aria-hidden="true" focusable="false"><use href="#i-by-parent"></use></svg>부모님이 이렇게 정했습니다: 집에 들이지는 않고 먹이만 챙겨 주기로 한다</em><span class="log__result">집에 들이지는 않고 남은 밥만 챙겨 주기로 했습니다. 어느 날부터 강아지는 보이지 않았습니다.</span></span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">11세</span><span class="log__text">학교까지는 걸어서 한 시간이 걸렸습니다. 길에서 만난 동무들과 노래를 부르며 걸었습니다.</span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">11세</span><span class="log__text">친할머니가 81세에 세상을 떠나셨습니다.</span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">11세</span><span class="log__text">셋째 동생으로 남동생이 태어났습니다.</span></li><li class="log__row log__row--tl" data-kind="timeline" data-tl="era" id="log-y1980" tabindex="-1" aria-live="off" data-testid="log-row-era"><span class="log__age">11세<small class="log__year">1980</small></span><span class="log__text"><span class="log__tl"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-era"></use></svg><span>시대의 창</span></span><span class="log__sent">5월, 광주에 민주화 시위가 있었습니다.</span></span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">10세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">문방구 앞의 딱지와 구슬, 사 달라고 할까?</span><em>선택: 조른다</em><span class="log__result">며칠을 졸랐지만 어른은 고개를 저었습니다. 문방구 앞을 지날 때마다 걸음이 느려졌습니다.</span></span></li><li class="log__row log__row--tl" data-kind="timeline" data-tl="era" id="log-y1979" tabindex="-1" aria-live="off" data-testid="log-row-era"><span class="log__age">10세<small class="log__year">1979</small></span><span class="log__text"><span class="log__tl"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-era"></use></svg><span>시대의 창</span></span><span class="log__sent">이 해 가을 대통령이 세상을 떠났습니다.</span></span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">8세</span><span class="log__text">아이는 책가방을 메고 처음으로 학교에 갔습니다. 교문 앞에서 몇 번이나 뒤를 돌아보았습니다.</span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">8세</span><span class="log__text">둘째 동생으로 남동생이 태어났습니다.</span></li><li class="log__row log__row--stage" data-kind="stage" data-testid="log-row"><span class="log__age">8세</span><span class="log__text">학교에 들어갈 나이가 되었습니다.</span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">7세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">또래가 다니는 교실과 도장, 보내 달라고 할까?</span><em>선택: 조른다</em><span class="log__result">여러 번 졸랐지만 어른은 고개를 저었습니다. 또래가 배우러 가는 시간이면 혼자 골목에 남았습니다.</span></span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">5세</span><span class="log__text">아이는 눈에 띄는 것마다 이름과 까닭을 물었습니다. 아이의 질문은 하루 종일 끊이지 않았습니다.</span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">5세</span><span class="log__text">외할아버지가 68세에 세상을 떠나셨습니다.</span></li><li class="log__row log__row--tl" data-kind="timeline" data-tl="era" id="log-y1974" tabindex="-1" aria-live="off" data-testid="log-row-era"><span class="log__age">5세<small class="log__year">1974</small></span><span class="log__text"><span class="log__tl"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-era"></use></svg><span>시대의 창</span></span><span class="log__sent">수도권에 지하철이 처음 다녔습니다.</span></span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">4세</span><span class="log__text">남동생이 태어났습니다.</span></li><li class="log__row log__row--tl" data-kind="timeline" data-tl="era" id="log-y1973" tabindex="-1" aria-live="off" data-testid="log-row-era"><span class="log__age">4세<small class="log__year">1973</small></span><span class="log__text"><span class="log__tl"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-era"></use></svg><span>시대의 창</span></span><span class="log__sent">10월, 기름값이 크게 올라 물가가 뛰기 시작했습니다.</span></span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">3세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">일하러 나간 낮, 어디에 맡길까?</span><em class="log__by log__by--parent" data-testid="log-by" data-by="parent"><svg class="icon icon--xs" aria-hidden="true" focusable="false"><use href="#i-by-parent"></use></svg>부모님이 이렇게 정했습니다: 아이를 돌봐 주는 곳에 보낸다</em><span class="log__result">또래 아이들과 하루를 보내기 시작했습니다. 처음 몇 주는 아침마다 울었지만 차츰 익숙해졌습니다.</span></span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">2세</span><span class="log__text">겨울이면 온 식구가 아랫목에 모여 잤습니다. 밤새 연탄불이 꺼지지 않게 어른들이 번갈아 일어났습니다.</span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">2세</span><span class="log__text">아이가 처음으로 낱말 하나를 말했습니다. 곁에 있던 어른들이 한참을 웃었습니다.</span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">2세</span><span class="log__text">아이가 붙잡고 서더니 처음으로 혼자 몇 걸음을 걸었습니다. 모두가 숨을 죽였습니다.</span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">1세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">처음 먹는 밥, 무엇을 먹일까?</span><em class="log__by log__by--parent" data-testid="log-by" data-by="parent"><svg class="icon icon--xs" aria-hidden="true" focusable="false"><use href="#i-by-parent"></use></svg>부모님이 이렇게 정했습니다: 남이 만든 것을 사다 먹인다</em><span class="log__result">남이 만든 것을 사다 먹이며 끼니를 해결했습니다. 아이가 먹는 동안 어른들도 한숨 돌렸습니다.</span></span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">1세</span><span class="log__text">첫 예방 주사를 맞던 날, 아이는 크게 울었습니다. 어른들은 아이를 안아 달랜 뒤 집으로 돌아왔습니다.</span></li><li class="log__row log__row--tl" data-kind="timeline" data-tl="era" id="log-y1970" tabindex="-1" aria-live="off" data-testid="log-row-era"><span class="log__age">1세<small class="log__year">1970</small></span><span class="log__text"><span class="log__tl"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-era"></use></svg><span>시대의 창</span></span><span class="log__sent">7월, 서울과 부산을 잇는 고속도로가 뚫렸습니다.</span></span></li><li class="log__row log__row--stage" data-kind="stage" data-testid="log-row"><span class="log__age">1세</span><span class="log__text">1970년 12월, 충청남도의 넉넉하지는 않은 가정에서 3.3kg 남자아이로 태어났습니다. 셋째입니다. (3.3kg은 상위 약 40%)</span></li></ol></div></section></div><div class="col col--right"><section class="card era-card" id="era-card" aria-labelledby="era-title" data-testid="era-card" data-paired="true" style="--era-card-h: 303px;"><h2 id="era-title" class="card__title card__title--gap">시대의 창</h2><div class="era" id="scene-era" data-empty="true" data-hidden="false"><span class="era__pic era__pic--empty" aria-hidden="true"><i class="era__sheet"></i></span></div></section><section class="card family" aria-labelledby="family-t" data-testid="family-card"><h2 id="family-t" class="card__title card__title--gap" tabindex="-1">식구</h2><dl class="family-list" data-testid="family-list"><dt>아버지</dt><dd data-testid="family-father" data-state="apart"><span class="family-who">임태수 77세</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="아주 가까움 · 은퇴 · 따로 삶" aria-hidden="true"></span>아주 가까움 · 은퇴 · 따로 삶</span></small></dd><dt>형</dt><dd data-testid="family-sibling" data-state="apart"><span class="family-who">임병철 48세</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="데면데면함 · 전문직 · 따로 삶" aria-hidden="true"></span>데면데면함 · 전문직 · 따로 삶</span></small></dd><dt>누나</dt><dd data-testid="family-sibling" data-state="apart"><span class="family-who">임영순 52세</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="가까움 · 단순노무직 · 따로 삶" aria-hidden="true"></span>가까움 · 단순노무직 · 따로 삶</span></small></dd><dt>남동생</dt><dd data-testid="family-sibling" data-state="apart"><span class="family-who">임성훈 41세</span><small><span class="fit-pair fit-pair--flow is-split" data-split="true"><span class="fit-pair__probe" data-text="가까움 · 기계 조작직 · 따로 삶" aria-hidden="true"></span><span class="fit-pair__item">가까움,</span> <span class="fit-pair__item">기계 조작직,</span> <span class="fit-pair__item">따로 삶</span></span></small></dd><dt>남동생</dt><dd data-testid="family-sibling" data-state="apart"><span class="family-who">임상철 37세</span><small><span class="fit-pair fit-pair--flow is-split" data-split="true"><span class="fit-pair__probe" data-text="데면데면함 · 기계 조작직 · 따로 삶" aria-hidden="true"></span><span class="fit-pair__item">데면데면함,</span> <span class="fit-pair__item">기계 조작직,</span> <span class="fit-pair__item">따로 삶</span></span></small></dd><dt>남동생</dt><dd data-testid="family-sibling" data-state="apart"><span class="family-who">임민석 34세</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="보통 · 전문직 · 따로 삶" aria-hidden="true"></span>보통 · 전문직 · 따로 삶</span></small></dd><dt>배우자</dt><dd data-testid="family-spouse" data-state="with"><span class="family-who">김미란 42세</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="가까움 · 서비스직" aria-hidden="true"></span>가까움 · 서비스직</span></small></dd></dl><h3 class="family-sub">집에 있는 것</h3><p class="family-things" data-testid="family-things"><span class="nowrap">스마트폰</span>, <span class="nowrap">에어컨</span>, <span class="nowrap">인터넷</span>, <span class="nowrap">휴대전화</span>, <span class="nowrap">컴퓨터</span>, <span class="nowrap">전자레인지</span>, <span class="nowrap">승용차</span>, <span class="nowrap">컬러 텔레비전</span></p><h3 class="family-sub">떠난 가족</h3><dl class="family-list family-list--gone" data-testid="family-gone"><dt>어머니</dt><dd data-testid="family-mother" data-state="gone"><span class="family-who">최정순</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="69세에 세상을 떠남" aria-hidden="true"></span><span class="nowrap">69세에</span> 세상을 떠남</span></small></dd><dt>친할아버지</dt><dd data-testid="family-grandparent" data-state="gone"><span class="family-who">임광수</span><small><span class="fit-pair fit-pair--flow is-split" data-split="true"><span class="fit-pair__probe" data-text="내가 태어나기 전에 세상을 떠남(51세)" aria-hidden="true"></span><span class="fit-pair__item">내가 태어나기 전에 세상을 <span class="keep-phrase">떠남(<span class="nowrap">51세</span>)</span></span></span></small></dd><dt>친할머니</dt><dd data-testid="family-grandparent" data-state="gone"><span class="family-who">정미자</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="81세에 세상을 떠남" aria-hidden="true"></span><span class="nowrap">81세에</span> 세상을 떠남</span></small></dd><dt>외할아버지</dt><dd data-testid="family-grandparent" data-state="gone"><span class="family-who">최영식</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="68세에 세상을 떠남" aria-hidden="true"></span><span class="nowrap">68세에</span> 세상을 떠남</span></small></dd><dt>외할머니</dt><dd data-testid="family-grandparent" data-state="gone"><span class="family-who">김옥자</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="76세에 세상을 떠남" aria-hidden="true"></span><span class="nowrap">76세에</span> 세상을 떠남</span></small></dd></dl><button type="button" class="btn btn--ghost btn--sm family-more" aria-expanded="false" data-testid="family-more">더 보기</button><details class="disclosure family-basis" data-testid="family-basis"><summary>이 칸은 어떻게 정했나요</summary><p>식구의 이름, 나이, 사이, 직업과 집에 있는 것은 통계와 게임이 정한 값이 섞여 있습니다. 칸마다 어디까지가 통계인지 밝힙니다.</p><ul><li><strong>확인</strong> 식구가 몇 살까지 사셨는지는 통계청 간이생명표(1970~2024년)의 나이대별 사망확률로 정했습니다. 2024년 뒤에는 2024년 값을 그대로 씁니다.</li><li><strong>추정</strong> 1970년 앞의 생명표는 없어서, 1970년 값에 배율을 곱해 기대수명이 1970년대 추세선을 거꾸로 이은 값이 되게 맞췄습니다(30세 아래로는 내리지 않았습니다).</li><li><strong>확인</strong> 어머니가 아이를 낳은 나이는 인구동향조사의 연령별 출생아 구성비(1981~2025년)를 썼습니다.</li><li><strong>확인(환산)</strong> 1956~1980년은 인구총조사의 어머니 연령별 자녀 수를 거슬러 계산했습니다(오차 ±0.5세).</li><li><strong>추정</strong> 1956년 앞 출생은 1966년 인구총조사 표본의 출산 어머니 나이 분포(평균 29.7세)를 그대로 거슬러 썼습니다. 한 해의 분포를 앞 시대에 이은 추정입니다.</li><li><strong>확인(환산)</strong> 조부모와 함께 사는 비율은 인구총조사의 아동 가구 세대 구성(2000년과 2005년)에서 계산했습니다.</li><li><strong>추정</strong> 그 밖의 해는 3세대 이상 가구 비율에 1.85를 곱해 이었습니다(2000년과 2005년의 실제 배율 1.73과 1.99의 가운데).</li><li><strong>설계값</strong> 함께 사는 조부모가 친가인지 외가인지는 통계가 없어 친가 70%, 외가 30%로 정했습니다.</li><li><strong>확인(환산)</strong> 부모의 이혼은 이혼 건수에 미성년 자녀 수의 하한을 곱해 미성년 인구로 나눈 근사입니다(1993~2025년).</li><li><strong>추정</strong> 1993년 앞은 1993년 값에 조이혼율의 비를 곱해 줄였습니다.</li><li><strong>설계값</strong> 이혼으로 떠난 부모와 같은 쪽 조부모는 다음 해부터 따로 사는 것으로 했습니다. 이혼 뒤 그 집안 조부모와 함께 사는 일은 드물다고 본 설계값입니다.</li><li><strong>확인(환산)</strong> 집의 종류는 인구총조사 거처의 종류별 가구 수(시도별, 1970~2025년)에서 여섯 칸 구성비를 계산했습니다. 전체 가구 기준이라 갓난아이가 있는 가구의 특성은 따로 보정하지 않았습니다.</li><li><strong>추정</strong> 조사한 해 사이는 두 해를 이어 계산하고, 분류가 바뀐 구간(1975→80, 2000→05, 2010→15)은 가까운 해의 값을 썼습니다. 시도 줄이 없던 승격 전 광역시는 부모 도의 줄을 썼습니다.</li><li><strong>설계값</strong> 1969년 이하 출생은 1970년 구성비를 거슬러 썼습니다(건물 종류 표가 없습니다). 아파트는 0.1%, 다세대는 0으로 두고, 주택 이외의 거처는 1940~1999년 출생에서만 나옵니다.</li><li><strong>설계값</strong> 자가, 임차, 무상과 소득계층(수저 단계)은 인구총조사와 주거실태조사의 표를 서로 독립이라고 가정해 곱했습니다. 수저 단계를 소득계층으로 섞는 방법은 출생신고와 같고, 시도를 수도권, 광역시 등, 도지역 세 갈래로 묶은 것은 게임이 정했습니다.</li><li><strong>설계값</strong> 단독주택에 임차로 사는 가구 가운데 셋방인 비율(1990년 앞 85%, 2005년 60%, 2020년 50%)은 통계가 없어 게임이 정했습니다.</li><li><strong>확인(환산)</strong> 방 수는 인구총조사(1980~2010년)의 거처 종류와 가구원 수별 표에서 뽑았습니다. 1980년 앞은 1980년, 2010년 뒤는 2010년 값을 쓰고, 그해에 아주 드문 방 수는 쓰지 않았습니다.</li><li><strong>설계값</strong> 1945년 이전 출생 어머니는 자녀가 많던 시대라, 형제 수가 인구총조사의 평균 출생아 수와 ±0.45명 안에서 맞도록 게임이 값을 조정했습니다.</li><li><strong>설계값</strong> 19세 이하에 부모 한 분이 떠난 해에는 한 번만 건강 −1, 관계 −2, 행복 −8과 집안 살림(아버지 −500만 원, 어머니 −300만 원에 재력 배율 0.8~2.0)이 더해집니다. 통계가 없는 설계값입니다.</li><li><strong>설계값</strong> 아래 동생 수는 출생 순위별 출생 비중에서 유도한 근사이고, 터울 2~5년, 독립 나이 20~30세, 성별은 반반으로 게임이 정했습니다.</li><li><strong>설계값</strong> 식구 이름은 그 사람의 출생 연도에 맞는 이름 풀에서 뽑았습니다. 1940년대보다 앞서 태어난 분(주로 조부모)은 가장 오래된 1940년대 풀을, 2020년 뒤에 태어난 자녀는 가장 최근 풀을 대신 썼고, 1940년대 풀 자체도 통계가 아닌 추정 목록입니다. 성은 아버지 쪽과 형제가 주인공과 같고 어머니와 조모는 따로 뽑았습니다.</li><li><strong>설계값</strong> 부모의 직업은 출생신고에 적힌 값입니다. 은퇴 나이는 농림어업 65~75세, 그 밖 55~65세로 게임이 정했고, 그 나이가 되면 직업 줄이 「은퇴」로 바뀝니다.</li><li><strong>설계값</strong> 형제, 배우자, 자녀, 친구, 조부모의 직업은 통계가 없어, 출생신고의 직업 분포에 시대 보정을 한 값에서 한 번 뽑았습니다. 6~22세는 「학생」으로 봅니다.</li><li><strong>설계값</strong> 배우자, 자녀, 가까운 친구의 수와 나이는 통계가 아니라 게임이 정했습니다. 배우자와의 나이 차는 부모 나이 차와 같은 모양이되 처음 만난 해에 20세 이상이고, 자녀는 첫 자녀를 낳은 시대에 따라 1~4명(경제에는 쓰이지 않고 보이기만 합니다), 터울은 2~5년, 친구는 1~3명입니다.</li><li><strong>설계값</strong> 사이의 다섯 단계(아주 가까움~멀어짐)는 통계가 없습니다. 호칭별 기본값, 부모는 양육 방식, 사람마다 한 단계 안팎의 차이에 더해 사건이 바꾼 것만 반영합니다. 사건 없이 슬며시 바뀌지 않습니다.</li><li><strong>설계값</strong> 반려동물의 이름 목록과 수명(개 10~16년, 고양이 12~18년, 그 밖 2~8년)은 통계가 없어 게임이 정했습니다. 부모 집의 반려동물은 아직 만들지 않고, 사건으로 들인 동물만 보입니다.</li><li><strong>설계값</strong> 집에 있는 것의 보급된 해와 보급 속도는 가구 내구재 보급 통계를 찾아 맞추기 전에 게임이 정한 값입니다. 수저 단계가 높을수록 일찍 들이지만 전체 평균은 이 곡선 그대로입니다. 2025년 뒤에는 새 물건을 만들지 않고, 보급률 숫자는 화면에 쓰지 않습니다.</li></ul></details></section><section class="card peers-now" aria-labelledby="peers-now-t" data-testid="peers-now-card"><div class="card__head card__head--tight"><h2 id="peers-now-t" class="card__title">같은 해 태어난 사람들</h2><span class="card__sub">요즘 모습</span></div><ul class="people" data-testid="peers-now"><li data-testid="peer-now"><div class="people__who"><div class="people__line"><span class="name" data-testid="peer-now-name">박은주</span> <span class="sub">여성</span></div><div class="sub">전라남도(지금의 전남광주통합특별시)</div></div><span class="grade grade--1" data-grade="1"><svg class="spoon" aria-hidden="true" focusable="false"><use href="#sp-1"></use></svg><span>흙수저</span><span class="grade__dots" role="img" aria-label="5단계 중 1단계"><i class="on"></i><i></i><i></i><i></i><i></i></span></span><span class="people__now" data-testid="peer-now-label">돌봄</span></li><li data-testid="peer-now"><div class="people__who"><div class="people__line"><span class="name" data-testid="peer-now-name">김현숙</span> <span class="sub">여성</span></div><div class="sub">서울특별시</div></div><span class="grade grade--1" data-grade="1"><svg class="spoon" aria-hidden="true" focusable="false"><use href="#sp-1"></use></svg><span>흙수저</span><span class="grade__dots" role="img" aria-label="5단계 중 1단계"><i class="on"></i><i></i><i></i><i></i><i></i></span></span><span class="people__now" data-testid="peer-now-label">일하는 사람</span></li><li data-testid="peer-now"><div class="people__who"><div class="people__line"><span class="name" data-testid="peer-now-name">이성수</span> <span class="sub">남성</span></div><div class="sub">서울특별시</div></div><span class="grade grade--1" data-grade="1"><svg class="spoon" aria-hidden="true" focusable="false"><use href="#sp-1"></use></svg><span>흙수저</span><span class="grade__dots" role="img" aria-label="5단계 중 1단계"><i class="on"></i><i></i><i></i><i></i><i></i></span></span><span class="people__now" data-testid="peer-now-label">일하는 사람</span></li><li data-testid="peer-now"><div class="people__who"><div class="people__line"><span class="name" data-testid="peer-now-name">김성호</span> <span class="sub">남성</span></div><div class="sub">충청북도</div></div><span class="grade grade--2" data-grade="2"><svg class="spoon" aria-hidden="true" focusable="false"><use href="#sp-2"></use></svg><span>동수저</span><span class="grade__dots" role="img" aria-label="5단계 중 2단계"><i class="on"></i><i class="on"></i><i></i><i></i><i></i></span></span><span class="people__now" data-testid="peer-now-label">일하는 사람</span></li></ul><p class="t-xs t-faint card__note">나이와 수저에 따라 정한 설계값입니다(통계가 아님).</p></section></div></main><div class="page-end-space"></div></div></template>
