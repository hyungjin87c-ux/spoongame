"></use></svg>예측</span><button type="button" class="log__basis log__basis--btn" aria-expanded="false" aria-controls="why-era-2035" aria-label="예측, 전문가 전망 바탕. 근거 보기" data-testid="why-btn">전문가 전망 바탕</button></span><span class="log__sent">돌봄 일손을 못 구한 집이 늘었습니다. <span class="log__second" data-testid="log-second">집에서는 식구들이 번갈아 돌봄을 맡았습니다.</span></span><div class="log__why" id="why-era-2035" hidden="" data-testid="why-body"><p class="log__why-intro">이 장면과 관련된 말과 자료입니다.</p><ul><li>한국개발연구원(KDI), 정부 출연 연구기관, 『노인돌봄 인력의 전망과 정책 대응』 보고서 보도(베이비뉴스), 2026년, 보도 기준: 요양 인력이 2035년 약 50만 명 더 필요할 것으로 추산했습니다. 업무 부담이 지금과 같다고 놓은 추산이며 일손을 못 구한 집을 직접 센 것은 아닙니다.</li></ul></div></span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">65세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">지난번보다 나빠진 검진 결과, 어떻게 할까?</span><em>선택: 일정을 잡고 치료를 시작한다</em><span class="log__result">병원에 일정을 잡고 치료를 시작했습니다. 몸이 조금씩 풀렸고, 마음의 짐도 함께 덜어졌습니다.</span></span></li><li class="log__row log__row--tl" data-kind="timeline" data-tl="era" id="log-y2030" tabindex="-1" aria-live="off" data-testid="log-row-era"><span class="log__age">61세<small class="log__year">2030</small></span><span class="log__text"><span class="log__tlrow"><span class="log__tl"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-era"></use></svg><span>시대의 창</span></span><span class="chip--fc" data-testid="chip-fc" aria-hidden="true"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-ahead"></use></svg>예측</span><button type="button" class="log__basis log__basis--btn" aria-expanded="false" aria-controls="why-era-2030" aria-label="예측, 가상 시나리오. 근거 보기" data-testid="why-btn">가상 시나리오</button></span><span class="log__sent">기본소득 시범에 신청 줄이 길었습니다. <span class="log__second" data-testid="log-second">집에서는 시범 신청 서류를 가장 먼저 챙겼습니다.</span></span><div class="log__why" id="why-era-2030" hidden="" data-testid="why-body"><p class="log__why-intro">이 장면과 관련된 말과 자료입니다.</p><ul><li>샘 올트먼, OpenAI CEO, 에세이 「Moore's Law for Everything」, 2021년: AI로 힘이 노동에서 자본으로 옮겨 가니 그 부를 시민에게 나누자고 제안했습니다. 기본소득 시범의 해를 말한 글은 아닙니다. 2030년은 게임이 정한 시나리오입니다.</li><li data-counter="true"><strong class="log__why-tag">반대 근거</strong> 에바 비발트 외, 논문 첫 저자, 논문 「The Employment Effects of a Guaranteed Income」(부제 생략, NBER 워킹페이퍼), 2024년: 미국 두 주 실험에서 월 현금 지급이 근로 참여를 소폭 줄였다고 보고했습니다. 미국 실험 결과이며 한국의 시범이나 2030년을 내다본 것이 아닙니다.</li></ul></div></span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">60세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">나이 들어 가는 실감, 앞날을 어떻게 준비할까?</span><em>선택: 씀씀이를 줄이고 모아 둔다</em><span class="log__result">씀씀이를 줄이고 노후 자금을 챙겼습니다. 불안이 줄어든 만큼 즐거움도 함께 줄었습니다.</span></span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">58세</span><span class="log__text">부모님이 남기신 재산을 물려받았습니다.</span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">58세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">홀로 남으셨던 아버지의 마지막 날, 어떻게 할까?</span><em>선택: 모든 일을 내려놓고 곁을 지킨다</em><span class="log__result">하던 일을 두고 달려가 지친 몸으로 마지막까지 곁을 지켰습니다. 손을 잡고 있던 온기가 오래 남았습니다.</span></span></li><li class="log__row log__row--tl" data-kind="timeline" data-tl="era" id="log-y2026" tabindex="-1" aria-live="off" data-testid="log-row-era"><span class="log__age">57세<small class="log__year">2026</small></span><span class="log__text"><span class="log__tl"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-era"></use></svg><span>시대의 창</span></span><span class="log__sent">AI가 퍼지며 청년 일자리가 줄었다는 분석이 나왔습니다. <span class="log__second" data-testid="log-second">집에서는 식구가 낸 이력서에 답이 오지 않았습니다.</span></span></span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">55세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">사람을 줄이기로 한 회사의 면담, 어떻게 할까?</span><em>선택: 버티며 자 · 따로 삶</span></small></dd><dt>남동생</dt><dd data-testid="family-sibling" data-state="apart"><span class="family-who">임상철 59세</span><small><span class="fit-pair fit-pair--flow is-split" data-split="true"><span class="fit-pair__probe" data-text="데면데면함 · 기계 조작직 · 따로 삶" aria-hidden="true"></span><span class="fit-pair__item">데면데면함,</span> <span class="fit-pair__item">기계 조작직,</span> <span class="fit-pair__item">따로 삶</span></span></small></dd><dt>남동생</dt><dd data-testid="family-sibling" data-state="apart"><span class="family-who">임민석 56세</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="보통 · 전문직 · 따로 삶" aria-hidden="true"></span>보통 · 전문직 · 따로 삶</span></small></dd><dt>전 배우자</dt><dd data-testid="family-spouse" data-state="apart"><span class="family-who">김미란 64세</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="멀어짐 · 은퇴 · 따로 삶" aria-hidden="true"></span>멀어짐 · 은퇴 · 따로 삶</span></small></dd></dl><h3 class="family-sub">집에 있는 것</h3><p class="family-things" data-testid="family-things"><span class="nowrap">스마트폰</span>, <span class="nowrap">에어컨</span>, <span class="nowrap">인터넷</span>, <span class="nowrap">휴대전화</span>, <span class="nowrap">컴퓨터</span>, <span class="nowrap">전자레인지</span>, <span class="nowrap">승용차</span>, <span class="nowrap">컬러 텔레비전</span></p><h3 class="family-sub">떠난 가족</h3><dl class="family-list family-list--gone" data-testid="family-gone"><dt>어머니</dt><dd data-testid="family-mother" data-state="gone"><span class="family-who">최정순</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="69세에 세상을 떠남" aria-hidden="true"></span><span class="nowrap">69세에</span> 세상을 떠남</span></small></dd><dt>아버지</dt><dd data-testid="family-father" data-state="gone"><span class="family-who">임태수</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="91세에 세상을 떠남" aria-hidden="true"></span><span class="nowrap">91세에</span> 세상을 떠남</span></small></dd><dt>친할아버지</dt><dd data-testid="family-grandparent" data-state="gone"><span class="family-who">임광수</span><small><span class="fit-pair fit-pair--flow is-split" data-split="true"><span class="fit-pair__probe" data-text="내가 태어나기 전에 세상을 떠남(51세)" aria-hidden="true"></span><span class="fit-pair__item">내가 태어나기 전에 세상을 <span class="keep-phrase">떠남(<span class="nowrap">51세</span>)</span></span></span></small></dd><dt>친할머니</dt><dd data-testid="family-grandparent" data-state="gone"><span class="family-who">정미자</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="81세에 세상을 떠남" aria-hidden="true"></span><span class="nowrap">81세에</span> 세상을 떠남</span></small></dd><dt>외할아버지</dt><dd data-testid="family-grandparent" data-state="gone"><span class="family-who">최영식</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="68세에 세상을 떠남" aria-hidden="true"></span><span class="nowrap">68세에</span> 세상을 떠남</span></small></dd><dt>외할머니</dt><dd data-testid="family-grandparent" data-state="gone"><span class="family-who">김옥자</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="76세에 세상을 떠남" aria-hidden="true"></span><span class="nowrap">76세에</span> 세상을 떠남</span></small></dd></dl><button type="button" class="btn btn--ghost btn--sm family-more" aria-expanded="false" data-testid="family-more">더 보기</button><details class="disclosure family-basis" data-testid="family-basis"><summary>이 칸은 어떻게 정했나요</summary><p>식구의 이름, 나이, 사이, 직업과 집에 있는 것은 통계와 게임이 정한 값이 섞여 있습니다. 칸마다 어디까지가 통계인지 밝힙니다.</p><ul><li><strong>확인</strong> 식구가 몇 살까지 사셨는지는 통계청 간이생명표(1970~2024년)의 나이대별 사망확률로 정했습니다. 2024년 뒤에는 2024년 값을 그대로 씁니다.</li><li><strong>추정</strong> 1970년 앞의 생명표는 없어서, 1970년 값에 배율을 곱해 기대수명이 1970년대 추세선을 거꾸로 이은 값이 되게 맞췄습니다(30세 아래로는 내리지 않았습니다).</li><li><strong>확인</strong> 어머니가 아이를 낳은 나이는 인구동향조사의 연령별 출생아 구성비(1981~2025년)를 썼습니다.</li><li><strong>확인(환산)</strong> 1956~1980년은 인구총조사의 어머니 연령별 자녀 수를 거슬러 계산했습니다(오차 ±0.5세).</li><li><strong>추정</strong> 1956년 앞 출생은 1966년 인구총조사 표본의 출산 어머니 나이 분포(평균 29.7세)를 그대로 거슬러 썼습니다. 한 해의 분포를 앞 시대에 이은 추정입니다.</li><li><strong>확인(환산)</strong> 조부모와 함께 사는 비율은 인구총조사의 아동 가구 세대 구성(2000년과 2005년)에서 계산했습니다.</li><li><strong>추정</strong> 그 밖의 해는 3세대 이상 가구 비율에 1.85를 곱해 이었습니다(2000년과 2005년의 실제 배율 1.73과 1.99의 가운데).</li><li><strong>설계값</strong> 함께 사는 조부모가 친가인지 외가인지는 통계가 없어 친가 70%, 외가 30%로 정했습니다.</li><li><strong>확인(환산)</strong> 부모의 이혼은 이혼 건수에 미성년 자녀 수의 하한을 곱해 미성년 인구로 나눈 근사입니다(1993~2025년).</li><li><strong>추정</strong> 1993년 앞은 1993년 값에 조이혼율의 비를 곱해 줄였습니다.</li><li><strong>설계값</strong> 이혼으로 떠난 부모와 같은 쪽 조부모는 다음 해부터 따로 사는 것으로 했습니다. 이혼 뒤 그 집안 조부모와 함께 사는 일은 드물다고 본 설계값입니다.</li><li><strong>확인(환산)</strong> 집의 종류는 인구총조사 거처의 종류별 가구 수(시도별, 1970~2025년)에서 여섯 칸 구성비를 계산했습니다. 전체 가구 기준이라 갓난아이가 있는 가구의 특성은 따로 보정하지 않았습니다.</li><li><strong>추정</strong> 조사한 해 사이는 두 해를 이어 계산하고, 분류가 바뀐 구간(1975→80, 2000→05, 2010→15)은 가까운 해의 값을 썼습니다. 시도 줄이 없던 승격 전 광역시는 부모 도의 줄을 썼습니다.</li><li><strong>설계값</strong> 1969년 이하 출생은 1970년 구성비를 거슬러 썼습니다(건물 종류 표가 없습니다). 아파트는 0.1%, 다세대는 0으로 두고, 주택 이외의 거처는 1940~1999년 출생에서만 나옵니다.</li><li><strong>설계값</strong> 자가, 임차, 무상과 소득계층(수저 단계)은 인구총조사와 주거실태조사의 표를 서로 독립이라고 가정해 곱했습니다. 수저 단계를 소득계층으로 섞는 방법은 출생신고와 같고, 시도를 수도권, 광역시 등, 도지역 세 갈래로 묶은 것은 게임이 정했습니다.</li><li><strong>설계값</strong> 단독주택에 임차로 사는 가구 가운데 셋방인 비율(1990년 앞 85%, 2005년 60%, 2020년 50%)은 통계가 없어 게임이 정했습니다.</li><li><strong>확인(환산)</strong> 방 수는 인구총조사(1980~2010년)의 거처 종류와 가구원 수별 표에서 뽑았습니다. 1980년 앞은 1980년, 2010년 뒤는 2010년 값을 쓰고, 그해에 아주 드문 방 수는 쓰지 않았습니다.</li><li><strong>설계값</strong> 1945년 이전 출생 어머니는 자녀가 많던 시대라, 형제 수가 인구총조사의 평균 출생아 수와 ±0.45명 안에서 맞도록 게임이 값을 조정했습니다.</li><li><strong>설계값</strong> 19세 이하에 부모 한 분이 떠난 해에는 한 번만 건강 −1, 관계 −2, 행복 −8과 집안 살림(아버지 −500만 원, 어머니 −300만 원에 재력 배율 0.8~2.0)이 더해집니다. 통계가 없는 설계값입니다.</li><li><strong>설계값</strong> 아래 동생 수는 출생 순위별 출생 비중에서 유도한 근사이고, 터울 2~5년, 독립 나이 20~30세, 성별은 반반으로 게임이 정했습니다.</li><li><strong>설계값</strong> 식구 이름은 그 사람의 출생 연도에 맞는 이름 풀에서 뽑았습니다. 1940년대보다 앞서 태어난 분(주로 조부모)은 가장 오래된 1940년대 풀을, 2020년 뒤에 태어난 자녀는 가장 최근 풀을 대신 썼고, 1940년대 풀 자체도 통계가 아닌 추정 목록입니다. 성은 아버지 쪽과 형제가 주인공과 같고 어머니와 조모는 따로 뽑았습니다.</li><li><strong>설계값</strong> 부모의 직업은 출생신고에 적힌 값입니다. 은퇴 나이는 농림어업 65~75세, 그 밖 55~65세로 게임이 정했고, 그 나이가 되면 직업 줄이 「은퇴」로 바뀝니다.</li><li><strong>설계값</strong> 형제, 배우자, 자녀, 친구, 조부모의 직업은 통계가 없어, 출생신고의 직업 분포에 시대 보정을 한 값에서 한 번 뽑았습니다. 6~22세는 「학생」으로 봅니다.</li><li><strong>설계값</strong> 배우자, 자녀, 가까운 친구의 수와 나이는 통계가 아니라 게임이 정했습니다. 배우자와의 나이 차는 부모 나이 차와 같은 모양이되 처음 만난 해에 20세 이상이고, 자녀는 첫 자녀를 낳은 시대에 따라 1~4명(경제에는 쓰이지 않고 보이기만 합니다), 터울은 2~5년, 친구는 1~3명입니다.</li><li><strong>설계값</strong> 사이의 다섯 단계(아주 가까움~멀어짐)는 통계가 없습니다. 호칭별 기본값, 부모는 양육 방식, 사람마다 한 단계 안팎의 차이에 더해 사건이 바꾼 것만 반영합니다. 사건 없이 슬며시 바뀌지 않습니다.</li><li><strong>설계값</strong> 반려동물의 이름 목록과 수명(개 10~16년, 고양이 12~18년, 그 밖 2~8년)은 통계가 없어 게임이 정했습니다. 부모 집의 반려동물은 아직 만들지 않고, 사건으로 들인 동물만 보입니다.</li><li><strong>설계값</strong> 집에 있는 것의 보급된 해와 보급 속도는 가구 내구재 보급 통계를 찾아 맞추기 전에 게임이 정한 값입니다. 수저 단계가 높을수록 일찍 들이지만 전체 평균은 이 곡선 그대로입니다. 2025년 뒤에는 새 물건을 만들지 않고, 보급률 숫자는 화면에 쓰지 않습니다.</li></ul></details></section><section class="card peers-now" aria-labelledby="peers-now-t" data-testid="peers-now-card"><div class="card__head card__head--tight"><h2 id="peers-now-t" class="card__title">같은 해 태어난 사람들</h2><span class="card__sub">요즘 모습</span></div><ul class="people" data-testid="peers-now"><li data-testid="peer-now"><div class="people__who"><div class="people__line"><span class="name" data-testid="peer-now-name">박은주</span> <span class="sub">여성</span></div><div class="sub">전라남도(지금의 전남광주통합특별시)</div></div><span class="grade grade--1" data-grade="1"><svg class="spoon" aria-hidden="true" focusable="false"><use href="#sp-1"></use></svg><span>흙수저</span><span class="grade__dots" role="img" aria-label="5단계 중 1단계"><i class="on"></i><i></i><i></i><i></i><i></i></span></span><span class="people__now" data-testid="peer-now-label">은퇴</span></li><li data-testid="peer-now"><div class="people__who"><div class="people__line"><span class="name" data-testid="peer-now-name">김현숙</span> <span class="sub">여성</span></div><div class="sub">서울특별시</div></div><span class="grade grade--1" data-grade="1"><svg class="spoon" aria-hidden="true" focusable="false"><use href="#sp-1"></use></svg><span>흙수저</span><span class="grade__dots" role="img" aria-label="5단계 중 1단계"><i class="on"></i><i></i><i></i><i></i><i></i></span></span><span class="people__now" data-testid="peer-now-label">일하는 사람</span></li><li data-testid="peer-now"><div class="people__who"><div class="people__line"><span class="name" data-testid="peer-now-name">이성수</span> <span class="sub">남성</span></div><div class="sub">서울특별시</div></div><span class="grade grade--1" data-grade="1"><svg class="spoon" aria-hidden="true" focusable="false"><use href="#sp-1"></use></svg><span>흙수저</span><span class="grade__dots" role="img" aria-label="5단계 중 1단계"><i class="on"></i><i></i><i></i><i></i><i></i></span></span><span class="people__now" data-testid="peer-now-label">일하는 사람</span></li><li data-testid="peer-now"><div class="people__who"><div class="people__line"><span class="name" data-testid="peer-now-name">김성호</span> <span class="sub">남성</span></div><div class="sub">충청북도</div></div><span class="grade grade--2" data-grade="2"><svg class="spoon" aria-hidden="true" focusable="false"><use href="#sp-2"></use></svg><span>동수저</span><span class="grade__dots" role="img" aria-label="5단계 중 2단계"><i class="on"></i><i class="on"></i><i></i><i></i><i></i></span></span><span class="people__now" data-testid="peer-now-label">은퇴</span></li></ul><p class="t-xs t-faint card__note">나이와 수저에 따라 정한 설계값입니다(통계가 아님).</p></section></div></main><div class="page-end-space"></div></div></template>

aria-controls="scene-pic" data-testid="scene-fold">그림 접기</button></div></section><section class="card log" aria-labelledby="log-t" data-testid="log"><div class="card__head card__head--tight"><h2 id="log-t" class="card__title">인생 기록</h2><span class="t-xs t-faint" id="log-hint" data-testid="log-hint"><span class="keep-phrase">최신순 · 아래로</span> 스크롤하면 지난 기록</span></div><div class="log__list" role="region" aria-label="인생 기록" aria-describedby="log-hint" tabindex="0" data-testid="log-list"><ol aria-live="off" aria-relevant="additions" class="log__rows"><li class="log__row log__row--tl" data-kind="timeline" data-tl="era" id="log-y1983" tabindex="-1" aria-live="off" data-testid="log-row-era"><span class="log__age">14세<small class="log__year">1983</small></span><span class="log__text"><span class="log__tl"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-era"></use></svg><span>시대의 창</span></span><span class="log__sent">6월, 헤어진 가족을 찾는 생방송이 가을까지 이어졌습니다.</span></span></li><li class="log__row log__row--latest" data-kind="event" data-testid="log-row"><span class="log__age">13세</span><span class="log__text">8살 위인 누나가 독립해 집을 나섰습니다.</span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">12세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">며칠째 집 앞을 서성이는 강아지, 어떻게 할까?</span><em class="log__by log__by--parent" data-testid="log-by" data-by="parent"><svg class="icon icon--xs" aria-hidden="true" focusable="false"><use href="#i-by-parent"></use></svg>부모님이 이렇게 정했습니다: 집에 들이지는 않고 먹이만 챙겨 주기로 한다</em><span class="log__result">집에 들이지는 않고 남은 밥만 챙겨 주기로 했습니다. 어느 날부터 강아지는 보이지 않았습니다.</span></span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">11세</span><span class="log__text">학교까지는 걸어서 한 시간이 걸렸습니다. 길에서 만난 동무들과 노래를 부르며 걸었습니다.</span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">11세</span><span class="log__text">친할머니가 81세에 세상을 떠나셨습니다.</span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">11세</span><span class="log__text">셋째 동생으로 남동생이 태어났습니다.</span></li><li class="log__row log__row--tl" data-kind="timeline" data-tl="era" id="log-y1980" tabindex="-1" aria-live="off" data-testid="log-row-era"><span class="log__age">11세<small class="log__year">1980</small></span><span class="log__text"><span class="log__tl"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-era"></use></svg><span>시대의 창</span></span><span class="log__sent">5월, 광주에 민주화 시위가 있었습니다.</span></span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">10세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">문방구 앞의 딱지와 구슬, 사 달라고 할까?</span><em>선택: 조른다</em><span class="log__result">며칠을 졸랐지만 어른은 고개를 저었습니다. 문방구 앞을 지날 때마다 걸음이 느려졌습니다.</span></span></li><li class="log__row log__row--tl" data-kind="timeline" data-tl="era" id="log-y1979" tabindex="-1" aria-live="off" data-testid="log-row-era"><span class="log__age">10세<small class="log__year">1979</small></span><span class="log__text"><span class="log__tl"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-era"></use></svg><span>시대의 창</span></span><span class="log__sent">이 해 가을 대통령이 세상을 떠났습니다.</span></span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">8세</span><span class="log__text">아이는 책가방을 메고 처음으로 학교에 갔습니다. 교문 앞에서 몇 번이나 뒤를 돌아보았습니다.</span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">8세</span><span class="log__text">둘째 동생으로 남동생이 태어났습니다.</span></li><li class="log__row log__row--stage" data-kind="stage" data-testid="log-row"><span class="log__age">8세</span><span class="log__text">학교에 들어갈 나이가 되었습니다.</span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">7세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">또래가 다니는 교실과 도장, 보내 달라고 할까?</span><em>선택: 조른다</em><span class="log__result">여러 번 졸랐지만 어른은 고개를 저었습니다. 또래가 배우러 가는 시간이면 혼자 골목에 남았습니다.</span></span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">5세</span><span class="log__text">아이는 눈에 띄는 것마다 이름과 까닭을 물었습니다. 아이의 질문은 하루 종일 끊이지 않았습니다.</span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">5세</span><span class="log__text">외할아버지가 68세에 세상을 떠나셨습니다.</span></li><li class="log__row log__row--tl" data-kind="timeline" data-tl="era" id="log-y1974" tabindex="-1" aria-live="off" data-testid="log-row-era"><span class="log__age">5세<small class="log__year">1974</small></span><span class="log__text"><span class="log__tl"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-era"></use></svg><span>시대의 창</span></span><span class="log__sent">수도권에 지하철이 처음 다녔습니다.</span></span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">4세</span><span class="log__text">남동생이 태어났습니다.</span></li><li class="log__row log__row--tl" data-kind="timeline" data-tl="era" id="log-y1973" tabindex="-1" aria-live="off" data-testid="log-row-era"><span class="log__age">4세<small class="log__year">1973</small></span><span class="log__text"><span class="log__tl"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-era"></use></svg><span>시대의 창</span></span><span class="log__sent">10월, 기름값이 크게 올라 물가가 뛰기 시작했습니다.</span></span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">3세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">일하러 나간 낮, 어디에 맡길까?</span><em class="log__by log__by--parent" data-testid="log-by" data-by="parent"><svg class="icon icon--xs" aria-hidden="true" focusable="false"><use href="#i-by-parent"></use></svg>부모님이 이렇게 정했습니다: 아이를 돌봐 주는 곳에 보낸다</em><span class="log__result">또래 아이들과 하루를 보내기 시작했습니다. 처음 몇 주는 아침마다 울었지만 차츰 익숙해졌습니다.</span></span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">2세</span><span class="log__text">겨울이면 온 식구가 아랫목에 모여 잤습니다. 밤새 연탄불이 꺼지지 않게 어른들이 번갈아 일어났습니다.</span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">2세</span><span class="log__text">아이가 처음으로 낱말 하나를 말했습니다. 곁에 있던 어른들이 한참을 웃었습니다.</span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">2세</span><span class="log__text">아이가 붙잡고 서더니 처음으로 혼자 몇 걸음을 걸었습니다. 모두가 숨을 죽였습니다.</span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">1세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">처음 먹는 밥, 무엇을 먹일까?</span><em class="log__by log__by--parent" data-testid="log-by" data-by="parent"><svg class="icon icon--xs" aria-hidden="true" focusable="false"><use href="#i-by-parent"></use></svg>부모님이 이렇게 정했습니다: 남이 만든 것을 사다 먹인다</em><span class="log__result">남이 만든 것을 사다 먹이며 끼니를 해결했습니다. 아이가 먹는 동안 어른들도 한숨 돌렸습니다.</span></span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">1세</span><span class="log__text">첫 예방 주사를 맞던 날, 아이는 크게 울었습니다. 어른들은 아이를 안아 달랜 뒤 집으로 돌아왔습니다.</span></li><li class="log__row log__row--tl" data-kind="timeline" data-tl="era" id="log-y1970" tabindex="-1" aria-live="off" data-testid="log-row-era"><span class="log__age">1세<small class="log__year">1970</small></span><span class="log__text"><span class="log__tl"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-era"></use></svg><span>시대의 창</span></span><span class="log__sent">7월, 서울과 부산을 잇는 고속도로가 뚫렸습니다.</span></span></li><li class="log__row log__row--stage" data-kind="stage" data-testid="log-row"><span class="log__age">1세</span><span class="log__text">1970년 12월, 충청남도의 넉넉하지는 않은 가정에서 3.3kg 남자아이로 태어났습니다. 셋째입니다. (3.3kg은 상위 약 40%)</span></li></ol></div></section></div><div class="col col--right"><section class="card era-card" id="era-card" aria-labelledby  앞의 생명표는 없어서, 1970년 값에 배율을 곱해 기대수명이 1970년대 추세선을 거꾸로 이은 값이 되게 맞췄습니다(30세 아래로는 내리지 않았습니다).</li><li><strong>확인</strong> 어머니가 아이를 낳은 나이는 인구동향조사의 연령별 출생아 구성비(1981~2025년)를 썼습니다.</li><li><strong>확인(환산)</strong> 1956~1980년은 인구총조사의 어머니 연령별 자녀 수를 거슬러 계산했습니다(오차 ±0.5세).</li><li><strong>추정</strong> 1956년 앞 출생은 1966년 인구총조사 표본의 출산 어머니 나이 분포(평균 29.7세)를 그대로 거슬러 썼습니다. 한 해의 분포를 앞 시대에 이은 추정입니다.</li><li><strong>확인(환산)</strong> 조부모와 함께 사는 비율은 인구총조사의 아동 가구 세대 구성(2000년과 2005년)에서 계산했습니다.</li><li><strong>추정</strong> 그 밖의 해는 3세대 이상 가구 비율에 1.85를 곱해 이었습니다(2000년과 2005년의 실제 배율 1.73과 1.99의 가운데).</li><li><strong>설계값</strong> 함께 사는 조부모가 친가인지 외가인지는 통계가 없어 친가 70%, 외가 30%로 정했습니다.</li><li><strong>확인(환산)</strong> 부모의 이혼은 이혼 건수에 미성년 자녀 수의 하한을 곱해 미성년 인구로 나눈 근사입니다(1993~2025년).</li><li><strong>추정</strong> 1993년 앞은 1993년 값에 조이혼율의 비를 곱해 줄였습니다.</li><li><strong>설계값</strong> 이혼으로 떠난 부모와 같은 쪽 조부모는 다음 해부터 따로 사는 것으로 했습니다. 이혼 뒤 그 집안 조부모와 함께 사는 일은 드물다고 본 설계값입니다.</li><li><strong>확인(환산)</strong> 집의 종류는 인구총조사 거처의 종류별 가구 수(시도별, 1970~2025년)에서 여섯 칸 구성비를 계산했습니다. 전체 가구 기준이라 갓난아이가 있는 가구의 특성은 따로 보정하지 않았습니다.</li><li><strong>추정</strong> 조사한 해 사이는 두 해를 이어 계산하고, 분류가 바뀐 구간(1975→80, 2000→05, 2010→15)은 가까운 해의 값을 썼습니다. 시도 줄이 없던 승격 전 광역시는 부모 도의 줄을 썼습니다.</li><li><strong>설계값</strong> 1969년 이하 출생은 1970년 구성비를 거슬러 썼습니다(건물 종류 표가 없습니다). 아파트는 0.1%, 다세대는 0으로 두고, 주택 이외의 거처는 1940~1999년 출생에서만 나옵니다.</li><li><strong>설계값</strong> 자가, 임차, 무상과 소득계층(수저 단계)은 인구총조사와 주거실태조사의 표를 서로 독립이라고 가정해 곱했습니다. 수저 단계를 소득계층으로 섞는 방법은 출생신고와 같고, 시도를 수도권, 광역시 등, 도지역 세 갈래로 묶은 것은 게임이 정했습니다.</li><li><strong>설계값</strong> 단독주택에 임차로 사는 가구 가운데 셋방인 비율(1990년 앞 85%, 2005년 60%, 2020년 50%)은 통계가 없어 게임이 정했습니다.</li><li><strong>확인(환산)</strong> 방 수는 인구총조사(1980~2010년)의 거처 종류와 가구원 수별 표에서 뽑았습니다. 1980년 앞은 1980년, 2010년 뒤는 2010년 값을 쓰고, 그해에 아주 드문 방 수는 쓰지 않았습니다.</li><li><strong>설계값</strong> 1945년 이전 출생 어머니는 자녀가 많던 시대라, 형제 수가 인구총조사의 평균 출생아 수와 ±0.45명 안에서 맞도록 게임이 값을 조정했습니다.</li><li><strong>설계값</strong> 19세 이하에 부모 한 분이 떠난 해에는 한 번만 건강 −1, 관계 −2, 행복 −8과 집안 살림(아버지 −500만 원, 어머니 −300만 원에 재력 배율 0.8~2.0)이 더해집니다. 통계가 없는 설계값입니다.</li><li><strong>설계값</strong> 아래 동생 수는 출생 순위별 출생 비중에서 유도한 근사이고, 터울 2~5년, 독립 나이 20~30세, 성별은 반반으로 게임이 정했습니다.</li><li><strong>설계값</strong> 식구 이름은 그 사람의 출생 연도에 맞는 이름 풀에서 뽑았습니다. 1940년대보다 앞서 태어난 분(주로 조부모)은 가장 오래된 1940년대 풀을, 2020년 뒤에 태어난 자녀는 가장 최근 풀을 대신 썼고, 1940년대 풀 자체도 통계가 아닌 추정 목록입니다. 성은 아버지 쪽과 형제가 주인공과 같고 어머니와 조모는 따로 뽑았습니다.</li><li><strong>설계값</strong> 부모의 직업은 출생신고에 적힌 값입니다. 은퇴 나이는 농림어업 65~75세, 그 밖 55~65세로 게임이 정했고, 그 나이가 되면 직업 줄이 「은퇴」로 바뀝니다.</li><li><strong>설계값</strong> 형제, 배우자, 자녀, 친구, 조부모의 직업은 통계가 없어, 출생신고의 직업 분포에 시대 보정을 한 값에서 한 번 뽑았습니다. 6~22세는 「학생」으로 봅니다.</li><li><strong>설계값</strong> 배우자, 자녀, 가까운 친구의 수와 나이는 통계가 아니라 게임이 정했습니다. 배우자와의 나이 차는 부모 나이 차와 같은 모양이되 처음 만난 해에 20세 이상이고, 자녀는 첫 자녀를 낳은 시대에 따라 1~4명(경제에는 쓰이지 않고 보이기만 합니다), 터울은 2~5년, 친구는 1~3명입니다.</li><li><strong>설계값</strong> 사이의 다섯 단계(아주 가까움~멀어짐)는 통계가 없습니다. 호칭별 기본값, 부모는 양육 방식, 사람마다 한 단계 안팎의 차이에 더해 사건이 바꾼 것만 반영합니다. 사건 없이 슬며시 바뀌지 않습니다.</li><li><strong>설계값</strong> 반려동물의 이름 목록과 수명(개 10~16년, 고양이 12~18년, 그 밖 2~8년)은 통계가 없어 게임이 정했습니다. 부모 집의 반려동물은 아직 만들지 않고, 사건으로 들인 동물만 보입니다.</li><li><strong>설계값</strong> 집에 있는 것의 보급된 해와 보급 속도는 가구 내구재 보급 통계를 찾아 맞추기 전에 게임이 정한 값입니다. 수저 단계가 높을수록 일찍 들이지만 전체 평균은 이 곡선 그대로입니다. 2025년 뒤에는 새 물건을 만들지 않고, 보급률 숫자는 화면에 쓰지 않습니다.</li></ul></details></section><section class="card peers-now" aria-labelledby="peers-now-t" data-testid="peers-now-card"><div class="card__head card__head--tight"><h2 id="peers-now-t" class="card__title">같은 해 태어난 사람들</h2><span class="card__sub">요즘 모습</span></div><ul class="people" data-testid="peers-now"><li data-testid="peer-now"><div class="people__who"><div class="people__line"><span class="name" data-testid="peer-now-name">박은주</span> <span class="sub">여성</span></div><div class="sub">전라남도(지금의 전남광주통합특별시)</div></div><span class="grade grade--1" data-grade="1"><svg class="spoon" aria-hidden="true" focusable="false"><use href="#sp-1"></use></svg><span>흙수저</span><span class="grade__dots" role="img" aria-label="5단계 중 1단계"><i class="on"></i><i></i><i></i><i></i><i></i></span><   };
  var COPY = {
    title: function (sec) { return STAGE[sec] + '에 마음 쓸 곳'; },
    desc: '고른 쪽의 일을 더 자주 마주칠 뿐, 어떻게 될지는 알 수 없습니다.',
    keep: '고르지 않으면 지금대로 이어집니다.',
    none: '따로 없음',
    skip: '넘기기',
    skipDesc: '지금대로 두고, 이 시기에는 다시 묻지 않습니다.',
    nowLabel: '마음 쓰는 곳',
    change: '바꾸기',
    close: '닫기',
    idle: '이 시기에는 해당하는 일이 없습니다.',
    idleNow: function (t) { return '지금은 ' + t + '입니다. 이 시기에는 해당하는 일이 없습니다.'; },
    auto: '자동 모드는 마음 쓸 곳을 대신 고르지 않습니다.',
    announce: '이 시기 마음 쓸 곳을 고를 수 있습니다.',
  };

  if (!plan || !state || !ST[state] && plan !== 'none') {
    root.appendChild(document.getElementById('state-doc').content.cloneNode(true));
    var ul = document.getElementById('fx-links');
    ['A', 'B', 'C'].forEach(function (p) {
      Object.keys(ST).forEach(function (s) {
        var li = document.createElement('li');
        li.innerHTML = '<a href="?plan=' + p + '&state=' + s + '">안 ' + p + ' · 상태 ' + s + '</a> · <a href="?plan=' + p + '&state=' + s + '&theme=dark">다크</a>';
        ul.appendChild(li);
      });
    });
    return;
  }
  var st = ST[state] || ST.A;
  root.appendChild(document.getElementById('t-' + st.base).content.cloneNode(true));
  root.querySelector('.dash-page').insertAdjacentHTML('afterbegin', document.getElementById('t-sprite').innerHTML);
  if (q.get('theme') === 'dark') {
    var dk = root.querySelector('[data-testid=tool-dark]');
    if (dk) { dk.setAttribute('aria-pressed', 'true'); var u = dk.querySelector('use'); if (u) u.setAttribute('href', '#i-sun'); var on = dk.querySelector('.sr-only'); if (on) on.textContent = '켜짐'; }
  }

  function pick(id, s) {
    var h = '<div class="focus-pick" role="group" aria-labelledby="' + id + '-t" aria-describedby="' + id + '-d" id="' + id + '-pick">';
    s.list.forEach(function (i) {
      var on = s.cur === i;
      h += '<button type="button" class="chip-opt focus-opt" aria-pressed="' + on + '" data-topic="' + i + '"><svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg>' + TOPIC[i] + '</button>';
    });
    var noneOn = s.cur === -1;
    h += '<button type="button" class="chip-opt focus-opt focus-opt--none" aria-pressed="' + noneOn + '" data-topic="none"><svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg>' + COPY.none + '</button>';
    return h + '</div>';
  }
  function notes(s) {
    var out = [];
    var missing = s.cur !== null && s.cur >= 0 && s.list.indexOf(s.cur) < 0;
    if (missing) out.push(COPY.idleNow(TOPIC[s.cur])); else out.push(COPY.keep);
    if (s.auto) out.push(COPY.auto);
    return out.map(function (t) { return '<p class="focus-note">' + t + '</p>'; }).join('');
  }
  function skipBtn(id, cls) {
    return '<button type="button" class="btn btn--sm btn--ghost ' + cls + '" aria-describedby="' + id + '-skip">' + COPY.skip + '</button><span id="' + id + '-skip" hidden>' + COPY.skipDesc + '</span>';
  }
  function nowLine(id, s, open) {
    var missing = s.cur >= 0 && s.list.indexOf(s.cur) < 0;
    var val = s.cur === -1 ? COPY.none : TOPIC[s.cur];
    return '<div class="focus-now" data-idle="' + missing + '"><h2 class="focus-now__label" id="' + id + '-t">' + COPY.nowLabel + '</h2>' +
      '<p class="focus-now__value" id="' + id + '-v">' + val + '</p>' +
      '<button type="button" class="btn btn--sm btn--secondary focus-now__btn" aria-expanded="' + !!open + '" aria-controls="' + id + '-pick" aria-describedby="' + id + '-t ' + id + '-v">' + (open ? COPY.close : COPY.change) + '</button>' +
      (missing ? '<p class="focus-now__note">' + COPY.idle + '</p>' : '') + '</div>';
  }
  function changeBody(id, s) {
    return '<div class="focus-open"><p class="focus-desc" id="' + id + '-d">' + COPY.desc + '</p>' + pick(id, s) + '</div>';
  }

  // ---- 배치 (안별) — render(st)는 지난 그림을 지우고 다시 그린다. 시안 안에서 눌러 볼 수 있다(고르기 → 상시 줄, 바꾸기·닫기, 넘기기) ----
  var scene = root.querySelector('.scene-card');
  var yearRow = root.querySelector('.year-row');
  function clear() {
    root.querySelectorAll('[data-fx]').forEach(function (e) { e.remove(); });
    if (yearRow) yearRow.classList.remove('year-row--focus');
  }
  function askBody(id, s, titleTag) {
    return '<div class="focus-head"><' + titleTag + ' class="focus-title" id="' + id + '-t">' + COPY.title(s.sec) + '</' + titleTag + '>' + skipBtn(id, 'focus-skip') + '</div>' +
      '<p class="focus-desc" id="' + id + '-d">' + COPY.desc + '</p>' + pick(id, s) + notes(s);
  }
  function render(s) {
    clear();
    if (plan === 'A') {
      var html = s.mode === 'ask'
        ? '<section class="card focus-card" aria-labelledby="fc-t" data-testid="focus-card" data-fx>' + askBody('fc', s, 'h2') + '</section>'
        : '<section class="card focus-card focus-card--set" aria-labelledby="fc-t" data-testid="focus-card" data-fx>' + nowLine('fc', s, s.mode === 'change') + (s.mode === 'change' ? changeBody('fc', s) : '') + '</section>';
      scene.insertAdjacentHTML('afterend', html);
    } else if (plan === 'B') {
      var tb = root.querySelector('.toolbar');
      if (s.mode === 'ask') {
        tb.insertAdjacentHTML('afterend', '<section class="focus-band" aria-labelledby="fb-t" data-testid="focus-band" data-fx><div class="focus-band__inner">' +
          '<h2 class="focus-title" id="fb-t">' + COPY.title(s.sec) + '</h2><p class="focus-desc" id="fb-d">' + COPY.desc + '</p>' +
          pick('fb', s) + skipBtn('fb', 'focus-skip focus-band__skip') + '<div class="focus-band__notes">' + notes(s) + '</div></div></section>');
      } else {
        var missing = s.cur >= 0 && s.list.indexOf(s.cur) < 0;
        var val = s.cur === -1 ? COPY.none : TOPIC[s.cur];
        yearRow.classList.add('year-row--focus');
        yearRow.insertAdjacentHTML('beforeend', '<button type="button" class="focus-chip" aria-expanded="' + (s.mode === 'change') + '" aria-controls="fb-pick" aria-describedby="fb-chip-d" data-testid="focus-chip" data-fx><span class="focus-chip__k">마음</span><span aria-hidden="true">·</span><b>' + val + '</b></button><span id="fb-chip-d" hidden data-fx>' + COPY.nowLabel + ' ' + COPY.change + '</span>');
        if (s.mode === 'change' || missing) {
          tb.insertAdjacentHTML('afterend', '<section class="focus-band" aria-labelledby="fb-t" data-testid="focus-band" data-fx><div class="focus-band__inner focus-band__inner--set">' +
            nowLine('fb', s, s.mode === 'change') + (s.mode === 'change' ? '<p class="focus-desc" id="fb-d">' + COPY.desc + '</p>' + pick('fb', s) : '') + '</div></section>');
        }
      }
    } else if (plan === 'C') {
      var head = root.querySelector('.log > .card__head');
      var row = s.mode === 'ask'
        ? '<section class="focus-row" aria-labelledby="fr-t" data-testid="focus-row" data-fx><span class="log__age">' + s.age + '</span><div class="focus-row__body">' + askBody('fr', s, 'h3') + '</div></section>'
        : '<section class="focus-row focus-row--set" aria-labelledby="fr-t" data-testid="focus-row" data-fx><div class="focus-row__body">' + nowLine('fr', s, s.mode === 'change').replace('<h2', '<h3').replace('</h2>', '</h3>') + (s.mode === 'change' ? changeBody('fr', s) : '') + '</div></section>';
      head.insertAdjacentHTML('afterend', row);
    }
    measure();
  }
  var live = JSON.parse(JSON.stringify(st));
  root.addEventListener('click', function (e) {
    var t = e.target.closest('button');
    if (!t || !t.closest('[data-fx]')) return;
    if (t.hasAttribute('data-topic')) {
      var v = t.getAttribute('data-topic');
      live.cur = v === 'none' ? -1 : Number(v);
      live.mode = 'set';
    } else if (t.classList.contains('focus-skip')) {
      if (live.cur === null) live.cur = -1;
      live.mode = 'set';
    } else if (t.classList.contains('focus-now__btn') || t.classList.contains('focus-chip')) {
      live.mode = live.mode === 'change' ? 'set' : 'change';
    } else return;
    render(live);
  });

  // 앱이 하는 측정(고정 머리·하단 띠 높이)을 흉내 낸다 — ui/headRelease.ts · ui/useBottomBar.ts
  var htmlEl = document.documentElement;
  htmlEl.classList.add('has-bottom-bar', 'has-sticky-head');
  function measure() {
    var hd = root.querySelector('.dash-head');
    var bar = root.querySelector('.controls-fixed');
    if (hd) htmlEl.style.setProperty('--head-h', Math.round(hd.getBoundingClientRect().height) + 'px');
    if (bar) htmlEl.style.setProperty('--bar-h', Math.round(bar.getBoundingClientRect().height) + 'px');
    var era = root.querySelector('.era-card[data-paired]');
    var sc = root.querySelector('.scene-card');
    if (era && sc) era.style.setProperty('--era-card-h', Math.round(sc.getBoundingClientRect().height) + 'px');
  }
  render(st);
  window.addEventListener('resize', measure);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
})();
</script>
</body>
</html>
