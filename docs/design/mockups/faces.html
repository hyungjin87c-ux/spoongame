<!-- 시안(정적 HTML, 가짜 데이터): 디자인 시스템 토큰·컴포넌트 스타일을 그대로 불러 쓴다. 주소 끝에 ?theme=dark 를 붙이면 다크 테마, &motion=reduce 면 움직임 줄이기. -->
<link rel="stylesheet" href="../../../src/styles/tokens.css">
<link rel="stylesheet" href="ds.css">
<script>(function(){var q=new URLSearchParams(location.search);var t=q.get('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);if(q.get('motion')==='reduce')document.documentElement.setAttribute('data-motion','reduce');
/* 시안 전용: 다크 테마면 도구 줄의 다크모드 버튼을 켜짐 상태(aria-pressed + 아이콘 달→해)로 보인다. 구현에서는 상태값이 정한다(R-136②). */
document.addEventListener('DOMContentLoaded',function(){var dark=document.documentElement.getAttribute('data-theme')==='dark'||(!document.documentElement.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);if(!dark)return;document.querySelectorAll('[data-tool="dark"]').forEach(function(b){b.setAttribute('aria-pressed','true');var u=b.querySelector('use');if(u)u.setAttribute('href','#i-sun');var s=b.querySelector('.sr-only');if(s)s.textContent='켜짐';});});
/* 시안 전용 흉내(구현은 src/ui/barRelease.ts#watchBarRelease — 룰렛·출생신고·대시보드는 ui/useBottomBar.ts가 부른다): 하단 고정 띠(.bottom-bar, 대시보드는 모바일에서 고정되는 진행 줄 .controls-fixed)의 실제 높이를 <html>의 --bar-h로 알려
   본문 끝 여백·scroll-padding이 따르게 하고(CM10), 띠가 작은 뷰포트 높이(100svh 탐침)의 절반을 넘으면 <html class="bar-released">로 고정을 푼다(QM2-12, R-240 — innerHeight로 재지 않는다). 디자인 시스템 11절.
   대시보드의 sticky 헤더(.dash-head)도 고정 요소라 높이를 --head-h로 알리고(<html class="has-sticky-head">), 헤더 + 고정된 띠가 작은 뷰포트 높이의 절반을 넘게 덮으면 <html class="head-released">로 헤더 고정을 푼다(11-1, M4 — 구현은 developer가 같은 규칙으로). */
document.addEventListener('DOMContentLoaded',function(){var bar=document.querySelector('.bottom-bar, .controls-fixed');var head=document.querySelector('.dash-head');if(!bar&&!head)return;var root=document.documentElement;if(bar)root.classList.add('has-bottom-bar');if(head)root.classList.add('has-sticky-head');var probe=document.createElement('div');probe.setAttribute('aria-hidden','true');probe.style.cssText='position:fixed;top:0;left:0;width:0;height:100svh;visibility:hidden;pointer-events:none';document.body.appendChild(probe);function apply(){var vh=probe.offsetHeight||root.clientHeight||window.innerHeight;var released=false;if(bar){var h=bar.offsetHeight;root.style.setProperty('--bar-h',h+'px');released=h>vh*0.5;root.classList.toggle('bar-released',released);}if(head){var hh=head.offsetHeight;root.style.setProperty('--head-h',hh+'px');var fixedBar=bar&&!released&&getComputedStyle(bar).position==='fixed'?bar.offsetHeight:0;root.classList.toggle('head-released',hh+fixedBar>vh*0.5);}}apply();if(window.ResizeObserver){var ro=new ResizeObserver(apply);if(bar)ro.observe(bar);if(head)ro.observe(head);}window.addEventListener('resize',apply);});
/* 시안 전용 흉내(구현은 src/ui/focusReveal.ts#revealTopOfTallCard — DecisionCard가 **인라인 틀**의 선택지 onFocus에만 건다, CM10 예외 ② · M7b): 글자 200% × 좁은 폭에서 선택지 카드(라벨 여러 줄 + 영향 줄)가 가용 높이(화면 − 위·아래 고정 띠)보다 커지면
   키보드 포커스에서 위쪽 변을 머리 아래에 맞추고, 가용 높이에는 들어가지만 12px 틈까지는 못 들어가면 가용 영역 가운데에 둔다. 시트는 자기 스크롤 영역이라 걸지 않는다(2026-10-19 후속 — 감사 도구가 정적 시안에서 같은 동작을 보게) */
document.addEventListener('focusin',function(e){var el=e.target;if(!(el instanceof HTMLElement)||!el.matches('.decision--inline .choice'))return;try{if(!el.matches(':focus-visible'))return;}catch(_){return;}var GAP=12;var cs=getComputedStyle(el);var ring=(parseFloat(cs.outlineWidth)||0)+(parseFloat(cs.outlineOffset)||0);var rs=getComputedStyle(document.documentElement);var px=function(v){var n=parseFloat(v);return isFinite(n)?n:0;};var topInset=Math.max(0,px(rs.scrollPaddingTop)-GAP),bottomInset=Math.max(0,px(rs.scrollPaddingBottom)-GAP);var available=innerHeight-topInset-bottomInset;var box=el.getBoundingClientRect().height+ring*2;if(box>available){if(el.getBoundingClientRect().height+(ring-GAP)*2>innerHeight-px(rs.scrollPaddingTop)-px(rs.scrollPaddingBottom))el.scrollIntoView({block:'start',inline:'nearest'});return;}if(box<=available-GAP*2)return;var delta=el.getBoundingClientRect().top-ring-(topInset+(available-box)/2);if(Math.abs(delta)>=0.5)scrollBy({top:delta,behavior:'instant'});});
/* 시안 전용 흉내(구현은 src/ui/FitPair.tsx): 짧은 쌍 「A · B」(.fit-pair)가 한 줄에 들어가면 「A · B」, 안 들어가면 기호 없이 두 항목을 따로 줄로(QM2-10 규칙 3). 보이지 않는 탐침(.fit-pair__probe)의 폭을 칸 폭과 견준다 — 글자 크기·칸 폭이 바뀌면 다시 잰다 */
document.addEventListener('DOMContentLoaded',function(){var pairs=document.querySelectorAll('.fit-pair');if(!pairs.length)return;function render(p){var probe=p.querySelector('.fit-pair__probe');if(!probe)return;var split=probe.getBoundingClientRect().width>p.getBoundingClientRect().width+0.5;if(split===(p.getAttribute('data-split')==='true'))return;p.setAttribute('data-split',split?'true':'false');p.classList.toggle('is-split',split);var a=p.getAttribute('data-a')||'',b=p.getAttribute('data-b')||'';while(probe.nextSibling)p.removeChild(probe.nextSibling);if(split){var s1=document.createElement('span');s1.className='fit-pair__item';s1.textContent=a;var s2=document.createElement('span');s2.className='fit-pair__item';s2.textContent=b;p.appendChild(s1);p.appendChild(document.createTextNode(' '));p.appendChild(s2);}else if(p.getAttribute('data-hide-sep')==='true'){/* 한 줄 모양의 가운뎃점은 aria-hidden(구현 FitPair hideSeparator, K11) */var d=document.createElement('span');d.setAttribute('aria-hidden','true');d.textContent='·';p.appendChild(document.createTextNode(a+' '));p.appendChild(d);p.appendChild(document.createTextNode(' '+b));}else{p.appendChild(document.createTextNode(a+' · '+b));}}function all(){pairs.forEach(render);}all();window.addEventListener('resize',all);if(window.ResizeObserver){var ro=new ResizeObserver(all);pairs.forEach(function(p){ro.observe(p);});}});
/* 시안 전용 흉내(구현은 열린 시트 수를 세는 훅 useScrollLock — M7c T1·R-400): 모달 시트(.overlay)가 하나라도 있으면 잠그기 전에 스크롤바 폭(innerWidth − clientWidth, 겹쳐 그리는 스크롤바면 0)을 --scrollbar-w로 재어 두고 <html class="sheet-open">으로 문서 스크롤을 잠근다(ds.css). 정적 시안은 시트가 열리고 닫히지 않으므로 개수 = DOM의 .overlay 수 */
document.addEventListener('DOMContentLoaded',function(){var root=document.documentElement;if(document.querySelector('.overlay')===null)return;root.style.setProperty('--scrollbar-w',Math.max(0,window.innerWidth-root.clientWidth)+'px');root.classList.add('sheet-open');});
/* 시안 전용 흉내(구현은 기록 시트의 입력란 포커스 처리 — content-M7c 6-1 K4): 브라우저는 입력란에 포커스가 가면 **캐럿**만 보이게 스크롤하므로 글자 200% × 1280×800처럼 입력란이 시트 아래끝에 걸치면 상자 아래쪽과 포커스 링이 화면 밖에 남는다(CM10).
   포커스 때 입력란 상자 전체를 보이는 영역에 둔다 — 보통은 block: 'nearest', 가상 키보드 compact 상태(정적 시안은 ?state=compact가 .sheet--compact를 고정해 둔다 — 구현의 판정은 「입력 영역 포커스 + 보이는 높이에 시트 전체가 안 들어감」, design-system.md 11-10)에서는
   위쪽 변을 고정된 질문 줄 아래에 맞춰(block: 'start' — compact의 scroll-padding-top이 질문 줄 높이 + sp-2라 sticky 제목 아래에 놓인다, diff-003.md D-88) 그 아래 두 버튼이 함께 보이게(K3) */
document.addEventListener('focusin',function(e){var el=e.target;if(!(el instanceof HTMLElement)||!el.matches('.sheet .field__input'))return;el.scrollIntoView({block:el.closest('.sheet--compact')?'start':'nearest',inline:'nearest'});});})();</script>
