     ?state=rows | sheet | inline | fold | parent | ending | tools6,  &theme=dark 면 다크 테마. 하위 폴더 qi6/에 두는 이유는 qi5와 같다(tests/designAssets.test.ts 637행의 평면 glob — design-system.md 13-5).

     「펼쳐 보기」 버튼은 시안 전용 스크립트로 눌러 볼 수 있다(aria-expanded·hidden·글자 「펼쳐 보기」↔「접기」 — 구현은 상태값이 정하고 저장하지 않는다, M19). -->

<script>(function(){var q=new URLSearchParams(location.search);var t=q.get('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);
document.addEventListener('DOMContentLoaded',function(){var s=q.get('state')||'rows';document.body.setAttribute('data-state',s);var tpl=document.getElementById('state-'+s);var slot=document.getElementById('slot');if(tpl&&slot){slot.innerHTML='';slot.appendChild(tpl.content.cloneNode(true));}
/* 시안 전용: 「펼쳐 보기」/「접기」 토글 — 구현은 React 상태(저장 안 함) */
document.querySelectorAll('.veil__btn').forEach(function(b){b.addEventListener('click',function(){var open=b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',open?'true':'false');var body=document.getElementById(b.getAttribute('aria-controls'));if(body){if(open)body.removeAttribute('hidden');else body.setAttribute('hidden','');}var line=b.closest('.veil__line');if(line){var stamp=line.querySelector('.log__by, .tl-picked');if(stamp){if(open)stamp.setAttribute('hidden','');else stamp.removeAttribute('hidden');}}var ctx=b.getAttribute('data-ctx')||'';b.firstChild.textContent=(open?'접기 ':'펼쳐 보기 ');b.querySelector('.veil__mark').textContent=open?'▴':'▾';b.setAttribute('aria-label',(open?'접기 ':'펼쳐 보기 ')+ctx);});});
/* 시안 전용 흉내(구현은 src/ui/FitPair.tsx): 짧은 쌍 「A · B」 — mockLib.mjs의 같은 스크립트 */
var pairs=document.querySelectorAll('.fit-pair');function render(p){var probe=p.querySelector('.fit-pair__probe');if(!probe)return;var split=probe.getBoundingClientRect().width>p.getBoundingClientRect().width+0.5;if(split===(p.getAttribute('data-split')==='true'))return;p.setAttribute('data-split',split?'true':'false');p.classList.toggle('is-split',split);var a=p.getAttribute('data-a')||'',b=p.getAttribute('data-b')||'';while(probe.nextSibling)p.removeChild(probe.nextSibling);if(split){var s1=document.createElement('span');s1.className='fit-pair__item';s1.textContent=a;var s2=document.createElement('span');s2.className='fit-pair__item';s2.textContent=b;p.appendChild(s1);p.appendChild(document.createTextNode(' '));p.appendChild(s2);}else if(p.getAttribute('data-hide-sep')==='true'){var d=document.createElement('span');d.setAttribute('aria-hidden','true');d.textContent='·';p.appendChild(document.createTextNode(a+' '));p.appendChild(d);p.appendChild(document.createTextNode(' '+b));}else{p.appendChild(document.createTextNode(a+' · '+b));}}function all(){pairs.forEach(render);}all();window.addEventListener('resize',all);if(window.ResizeObserver){var ro=new ResizeObserver(all);pairs.forEach(function(p){ro.observe(p);});}
/* 시안 전용 흉내(구현은 useScrollLock): 모달이 있으면 문서 스크롤 잠금 */
var root=document.documentElement;if(document.querySelector('.overlay')!==null){root.style.setProperty('--scrollbar-w',Math.max(0,window.innerWidth-root.clientWidth)+'px');root.classList.add('sheet-open');}});})();</script>
