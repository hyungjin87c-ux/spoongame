     ?state=parent-first | parent-scholar | child-bully | child-family | rows | glyphs,  &theme=dark 면 다크 테마. 하위 폴더 qi5/에 두는 이유: tests/designAssets.test.ts 637행의 평면 glob이 수저 아이콘 없는 새 장을 「화면 시안 수」에 세기 때문(design-system.md 13-5). 구현(src/ui/dash/ParentCard.tsx·LogList.tsx·screens/EndingScreen.tsx)과 같은 DOM·클래스다 — 다른 점은 FitPair 대신 고정 글자, 영향 줄 기호 수는 손으로 적은 근사값. -->

<script>(function(){var q=new URLSearchParams(location.search);var t=q.get('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);
document.addEventListener('DOMContentLoaded',function(){var s=q.get('state')||'parent-first';document.body.setAttribute('data-state',s);var tpl=document.getElementById('state-'+s);var slot=document.getElementById('slot');if(tpl&&slot){slot.innerHTML='';slot.appendChild(tpl.content.cloneNode(true));}
/* 글리프 시트: 두 새 글리프 + 기존 아이콘 18개를 18px·14px로 — 18px에서 구분되는지 눈으로 본다(R-455) */
var sheet=document.getElementById('glyph-sheet');if(sheet){var NEW=['i-by-parent','i-by-child'],OLD=['i-people','i-smile','i-heart','i-book','i-check','i-info','i-auto','i-next','i-prev','i-forward','i-play','i-pause','i-music','i-pencil','i-moon','i-sun','i-message','i-exit'];function cell(id,cls){return '<div class="g-cell"><svg class="icon '+(cls||'')+'" aria-hidden="true" focusable="false"><use href="#'+id+'"/></svg><span class="g-lab">'+id+'</span></div>';}
function row(title,ids,cls){return '<div class="g-row"><h3 class="g-title">'+title+'</h3><div class="g-cells">'+ids.map(function(i){return cell(i,cls);}).join('')+'</div></div>';}
sheet.innerHTML=row('결정자 글리프 둘 — 72px(4배)',NEW,'g-72')+row('18px(칩·상태 미터 크기) — 새 글리프 둘 + 기존 아이콘 18개',NEW.concat(OLD),'g-18')+row('14px(기록 줄·엔딩 연표 icon--xs)',NEW.concat(OLD),'g-14')+'<p class="g-note">i-by-parent 「집안의 결정」= 지붕·벽·바닥 한 채(얼굴·사람 없음) · i-by-child 「흘러감」= 물결 둘(긴 것 위, 짧은 것 아래). 색은 currentColor(칩 --c-accent, 기록 줄은 글자색), 선 2px·둥근 끝 — ui-icons.svg와 같은 규칙.</p>';}});})();</script>
<style>
/* 시안 전용: 글리프 시트 */
#glyph-sheet { padding: var(--sp-4); background: var(--c-surface); color: var(--c-text); display: flex; flex-direction: column; gap: var(--sp-4); max-width: 920px; }
.g-title { font-size: var(--fs-sm); color: var(--c-text-2); margin: 0 0 var(--sp-2); font-weight: var(--fw-bold); }

svg.g-72 { width: 72px; height: 72px; }

.ph { color: var(--c-text-2); font-size: var(--fs-sm); }

      </div>

        <li class="log__row"><span class="log__age">8세</span><span class="log__text">학교에 들어갔습니다.</span></li>

<template id="state-child-family">

    <section class="card stack stack--sm" aria-label="상태"><div class="card__head card__head--flush"><h2 class="card__title">상태</h2></div>

      <div class="meter meter--happy"><span class="meter__label"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-smile"/></svg>행복</span><div class="meter__track" role="meter" aria-label="행복" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40"><div class="meter__fill" style="width:40%"></div></div><span class="meter__value">40</span></div>

  </div>

    <section class="card decision decision--parent decision--child" aria-labelledby="pc-title" data-testid="parent-card" data-by="child">
      <div class="decision__head">
        <span class="parent-chip parent-chip--child"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-by-child"/></svg><span>아이의 일</span></span>
        <span class="decision__when">1975년 <span aria-hidden="true">·</span> 14세</span>
      </div>
      <div class="decision__body">
        <h2 id="pc-title" class="decision__title" style="--title-chars:3">먼저 가야 할 사람</h2>

<!-- ========== 상태 5: 세 표지가 한 화면 — 인생 기록 줄(본인·부모·흘러감) + 엔딩 연표 세 줄 ========== -->
<template id="state-rows">
  <div class="col"></div>
  <div class="col col--center">
    <section class="card log" aria-label="인생 기록"><div class="card__head" style="margin-bottom:var(--sp-2)"><h2 class="card__title">인생 기록</h2><span class="t-xs t-faint">세 표지 — 본인 「(선택: …)」 · 부모 집 글리프 · 흘러감 물결 글리프</span></div>
      <ol class="log__rows">
        <li class="log__row log__row--latest"><span class="log__age">13세</span><span class="log__text">학원가의 불빛 아래에서 저녁을 보냈습니다. 점수는 올랐고 집에 오는 길은 늘 어두웠습니다. <em>(선택: 여러 학원을 돌며 밤까지 공부한다)</em></span></li>
        <li class="log__row"><span class="log__age">10세</span><span class="log__text">고개를 돌려 책을 폈습니다. 아무 일도 없었다는 듯 지냈지만 그 장면은 오래도록 남았습니다. <em class="log__by log__by--child" data-by="child"><svg class="icon icon--xs" aria-hidden="true" focusable="false"><use href="#i-by-child"/></svg>(이렇게 흘러갔습니다: 모른 척한다)</em></span></li>
        <li class="log__row"><span class="log__age">7세</span><span class="log__text">학교가 끝나면 빈집에서 혼자 숙제를 하고 어른들을 기다렸습니다. <em class="log__by log__by--parent" data-by="parent"><svg class="icon icon--xs" aria-hidden="true" focusable="false"><use href="#i-by-parent"/></svg>(부모님이 이렇게 정했습니다: 집에서 혼자 기다리게 한다)</em></span></li>
        <li class="log__row"><span class="log__age">3세</span><span class="log__text">어른이 동생을 안을 때마다 아이는 울며 매달렸습니다. 어른들의 손은 둘로 나뉘었습니다. <em class="log__by log__by--child" data-by="child"><svg class="icon icon--xs" aria-hidden="true" focusable="false"><use href="#i-by-child"/></svg>(이렇게 흘러갔습니다: 서운해서 울며 어른에게 매달린다)</em></span></li>
        <li class="log__row"><span class="log__age">1세</span><span class="log__text">어른들은 별일 아니라고 했습니다. 아이는 이틀을 앓고 털고 일어났지만 그 기억은 오래 남았습니다. <em class="log__by log__by--parent" data-by="parent"><svg class="icon icon--xs" aria-hidden="true" focusable="false"><use href="#i-by-parent"/></svg>(부모님이 이렇게 정했습니다: 별일 아니라며 넘긴다)</em></span></li>
        <li class="log__row"><span class="log__age">0세</span><span class="log__text">한 사람이 일을 쉬고 아이 곁을 지켰습니다. 아이의 하루는 일정했고 집안의 벌이는 줄었습니다. <em class="log__by log__by--parent" data-by="parent"><svg class="icon icon--xs" aria-hidden="true" focusable="false"><use href="#i-by-parent"/></svg>(부모님이 이렇게 정했습니다: 한 사람이 일을 쉬고 돌본다)</em></span></li>

    </section>
    <section class="card" aria-label="엔딩 연표 표본"><div class="card__head" style="margin-bottom:var(--sp-2)"><h2 class="card__title">연표</h2><span class="t-xs t-faint">엔딩 「사망과 선택」 아래 연표의 같은 세 표지</span></div>
      <p class="t-sm t-muted" style="margin-bottom:var(--sp-3)">살아오며 27번의 선택을 했습니다.<br>어린 시절의 큰 결정 가운데 6번은 부모님이 내렸고, 2번은 아이의 일로 흘러갔습니다.</p>
      <ol class="timeline">
        <li class="is-choice" data-kind="choice"><span class="log__age">1세</span><span><strong>한밤의 열</strong><span class="tl-picked" data-by="parent"><svg class="icon icon--xs" aria-hidden="true" focusable="false"><use href="#i-by-parent"/></svg>부모님이 이렇게 정했습니다: 별일 아니라며 넘긴다</span><span class="tl-text">어른들은 별일 아니라고 했습니다. 아이는 이틀을 앓고 털고 일어났지만 그 기억은 오래 남았습니다.</span></span></li>
        <li class="is-choice" data-kind="choice"><span class="log__age">10세</span><span><strong>교실의 한 아이</strong><span class="tl-picked" data-by="child"><svg class="icon icon--xs" aria-hidden="true" focusable="false"><use href="#i-by-child"/></svg>이렇게 흘러갔습니다: 모른 척한다</span><span class="tl-text">고개를 돌려 책을 폈습니다. 아무 일도 없었다는 듯 지냈지만 그 장면은 오래도록 남았습니다.</span></span></li>
        <li class="is-choice" data-kind="choice"><span class="log__age">13세</span><span><strong>늦은 밤의 학원가</strong><span class="tl-picked">선택: 여러 학원을 돌며 밤까지 공부한다</span><span class="tl-text">학원가의 불빛 아래에서 저녁을 보냈습니다. 점수는 올랐고 집에 오는 길은 늘 어두웠습니다.</span></span></li>
      </ol>
    </section>
    <p class="mock-tag">시안 · 가짜 데이터</p>
