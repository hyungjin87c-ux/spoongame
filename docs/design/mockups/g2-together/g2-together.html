/* ===== 제안: G2 덧카드 (lead-card) — dash.css 「부모님이 정한 카드」 블록(.decision--parent …) 뒤에 같은 글자로 옮긴다. 새 토큰 0 · 새 색 쌍 0 =====
   전체형(자동 모드·접힌 띠·부모 카드 두 장)은 .decision--parent 그대로 — 더하는 규칙이 없다(클래스 .lead-card는 시험·측정의 갈고리).
   시트 안 요약형 .lead-card--compact: 결정 시트 맨 위, 머리 줄 [칩 · 「자세히 보기」] → 제목(16px) → 고른 길(16px, 쪽빛 막대) → 영향 줄.
   펼치면 상황 문장·도장·인용이 전체 카드와 같은 자리에 나온다(숨김은 hidden 속성 — DOM 순서 = 읽기 순서). 연도·나이는 바로 아래 결정 카드 머리와 같은 해라 두지 않는다. */
.sheet > .lead-card { margin: var(--sp-3) var(--sp-4) 0; }
.lead-card--compact, .lead-card--strip { border-radius: var(--r-md); box-shadow: none; }
.lead-card--compact > .decision__head, .lead-card--strip > .decision__head { padding: var(--sp-2) var(--sp-2) 0 var(--sp-3); border-bottom: 0; }
.lead-card--compact > .decision__body { padding: 0 var(--sp-3) var(--sp-3); gap: var(--sp-2); }
.lead-card--compact .decision__title { font-size: var(--fs-md); }
.lead-card--compact .parent-pick { padding-block: 2px; }
.lead-card--compact .parent-pick__label { font-size: var(--fs-md); }
.lead-card__more { flex: none; font-weight: var(--fw-regular); }
.lead-card__more[aria-expanded='true'] .lead-card__mark { display: inline-block; transform: rotate(180deg); }
.lead-card [hidden] { display: none; }
/* 대안 A2 한 줄 띠 */
.lead-card--strip > .decision__body { padding: 0 var(--sp-3) var(--sp-3); gap: var(--sp-2); }
.lead-card__line { font-size: var(--fs-md); line-height: var(--lh-snug); word-break: keep-all; }
/* 고르지 않은 안 A0(전체 카드를 시트 안에 그대로) — 측정용 */
.sheet > .lead-card--in-sheet { box-shadow: none; }
@media (forced-colors: active) { .lead-card__more { border-color: CanvasText; } }

/* ===== 시안 전용: 설명 문서 ===== */
.g2-doc { max-width: 880px; margin: 0 auto; padding: var(--sp-7) var(--gutter, 16px) var(--sp-10); color: var(--c-text); }
.g2-doc h1 { font-size: var(--fs-2xl); line-height: var(--lh-tight); margin: 0 0 var(--sp-3); }
.g2-doc h2 { font-size: var(--fs-xl); line-height: var(--lh-snug); margin: var(--sp-8) 0 var(--sp-3); }
.g2-doc h3 { font-size: var(--fs-lg); margin: var(--sp-6) 0 var(--sp-2); }
.g2-doc p, .g2-doc li { line-height: var(--lh-body); word-break: keep-all; }
.g2-doc ul, .g2-doc ol { padding-left: 1.25em; margin: var(--sp-2) 0; }
.g2-doc li + li { margin-top: var(--sp-1); }
.g2-doc .lede { color: var(--c-text-2); font-size: var(--fs-md); }
.g2-doc table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); margin: var(--sp-3) 0; }
.g2-doc th, .g2-doc td { text-align: left; vertical-align: top; padding: var(--sp-2); border-bottom: 1px solid var(--c-border); }
.g2-doc td.num, .g2-doc th.num { text-align: right; font-variant-numeric: tabular-nums; }
.g2-doc blockquote { margin: var(--sp-3) 0; padding: var(--sp-3) var(--sp-4); border-left: 5px solid var(--c-accent); background: var(--c-surface); }
.g2-doc .pick { font-weight: var(--fw-bold); }
.g2-doc a { color: var(--c-link); }
.g2-doc .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--sp-3); margin: var(--sp-3) 0; }
.g2-doc .shots figure { margin: 0; }
.g2-doc .shots img { width: 100%; height: auto; border: 1px solid var(--c-border); display: block; }
.g2-doc .shots figcaption { font-size: var(--fs-sm); color: var(--c-text-2); margin-top: var(--sp-1); }
.g2-doc code { font-size: 0.9em; overflow-wrap: anywhere; }
@media (max-width: 600px) { .g2-doc table { font-size: var(--fs-xs); } .g2-doc th, .g2-doc td { padding: var(--sp-1); } }

<h2>2. 상태별 요점</h2>
<h3>상태 A · 15세 본인 카드(수동 모드)</h3>
<ul>
<li>결정 시트 맨 위에 G2 요약 카드를 둔다. 머리 줄은 칩 「부모님의 결정」과 「자세히 보기」, 그 아래 제목 「고등학교 원서」, 고른 길(쪽빛 막대), 영향 줄 순이다. 테두리와 왼쪽 놋쇠 막대는 대시보드 부모 카드와 같다.</li>
<li>상황 문장, 도장 「부모님이 이렇게 정했습니다」, 인용은 「자세히 보기」를 누르면 전체 카드와 같은 자리에 펼쳐진다. 연도·나이는 바로 아래 결정 카드 머리와 같은 해라서 G2 카드에는 두지 않는다.</li>
<li>시트의 이름, 첫 포커스(결정 카드 제목), Esc, 「잠시 덮어 두기」는 지금과 같다. 「다음 결정으로」로 15세 카드에 도착했을 때(결정 (3))도 같은 모양이다.</li>
<li>접으면 G2는 가운데 열 맨 위에 대시보드의 부모 카드 모양 그대로 남고, 그 아래에 접힌 띠가 온다.</li>
</ul>
<h3>상태 B · 15세 카드도 부모·흘러감인 해</h3>
<ul>
<li>결과 연출 한 구간에 [G2 카드 → 그 해 카드]를 쌓는다. 두 장 모두 지금 부모 카드 그대로이고 새 규칙이 없다. 판의 첫 부모 카드 안내는 위 카드에만 붙는다.</li>
<li>360×740에서는 둘째 카드의 머리(646px)가 진행 줄(692px) 위로 보여 아래에 한 장이 더 있다는 것이 드러난다. 대기 시간은 두 카드의 읽기 필요량 합이다.</li>
</ul>
<h3>상태 C · 자동 모드</h3>
<ul>
<li>가운데 열 맨 위에 [G2 전체 카드 → 인라인 결정 카드]. 자동 선택 지연은 G2 읽기 필요량(최대 약 37초 ÷ 배속)이다. G2를 전체 카드로 두어야 화면의 글 양과 지연 계산이 맞는다.</li>
<li>360에서는 인라인 카드 제목이 첫 화면 아래(763px)에 온다. 지연이 그만큼 내려 읽을 시간을 준다.</li>
</ul>

<h2>3. 고르실 것</h2>
<ol>
<li><b>시트 안 G2 카드 모양</b>
<ul>
<li class="pick">(가) A1 요약 카드: 칩 · 제목 · 고른 길 · 영향 줄, 나머지는 「자세히 보기」로 펼침. <b>추천</b>. G2의 효과는 이미 스탯에 들어가 있어 영향 줄이 보여야 왜 바뀌었는지 알 수 있고(표기 = 실제 효과), 가장 긴 본인 카드에서도 첫 선택지가 360×740 한 화면에 들어간다.</li>

</ul></li>

</ul>

<h2>5. SPEC-005 LR5 (b)·PD8 (a)에 달 예외 문장 초안</h2>
<blockquote><b>LR5 (b) 끝에 덧붙임</b>: 「예외: 같은 해 덧카드(SPEC-018 G2 「고등학교 원서」, 결정 후속 255·262). 15세에 본인 결정 카드와 G2가 같은 해에 뜨면 G2 카드를 결정 카드 <b>위</b>에 둔다(연표 순서 「G2 → 그 해 카드」와 같다). 수동 모드에서는 결정 시트 안 맨 위에 요약형으로 두고, 자동 모드이거나 결정 카드를 접었을 때는 가운데 열 맨 위에 [G2 카드 → 인라인 결정 카드 또는 접힌 띠] 순으로 둔다. 그 해 카드도 부모·흘러감 카드이면 [G2 카드 → 그 해 카드]를 한 결과 연출 구간에 쌓는다. 이 예외는 G2 동반 해에만 적용하고, 다른 부모 카드의 자리는 그대로다.」</blockquote>
<blockquote><b>PD8 (a) 끝에 덧붙임</b>: 「예외: G2 동반 해(LR5 (b) 예외)에는 모달 시트 안 맨 위에 부모 결정 카드 한 장(G2)을 요약형으로 함께 둔다. 요약형은 칩·제목·고른 길·영향 줄을 보이고, 상황 문장·도장·인용은 「자세히 보기」로 펼친다. 누를 것은 이 단추 하나다(선택지·「잠시 덮어 두기」·자동 고르기 없음). 시트의 이름(<code>aria-labelledby</code>), 첫 포커스, Esc, 접기는 결정 카드의 것 그대로이고, 시트 설명(<code>aria-describedby</code>)이 G2의 칩·제목·고른 길을 가리킨다. 접힌 띠에는 넣지 않는다. 접으면 G2는 띠 위 가운데 열에 전체 카드로 남는다.」</blockquote>

<h2>6. 접근성 메모</h2>
<h3>읽기 순서(DOM 순서 = 화면 순서)</h3>
<ul>
<li>A: 시트 [G2 요약 카드: 칩 → 「자세히 보기」 → 제목 → (상황) → 고른 길 → (도장) → 영향 줄 → (인용)] → 결정 카드 머리 → 제목 → 상황 → (인용) → 질문 줄과 선택지 → 안내 → 자동 고르기 묶음. 괄호는 펼쳤을 때만 있다(<code>hidden</code>, DOM 순서는 그대로).</li>
<li>B: G2 카드 → 그 해 카드 → 집과 가족 그림 → 인생 기록. C: G2 카드 → 인라인 결정 카드 → 그 아래 지금과 같음. 360 한 열에서는 둘 다 <code>order: -1</code>이고 DOM 순서대로 쌓인다.</li>
</ul>
<h3>초점</h3>
<ul>
<li>A: 시트가 열리면 결정 카드 제목(<code>dc-title</code>)으로 간다(지금 규칙 11-10 그대로). Tab은 첫 선택지로, Shift+Tab은 「잠시 덮어 두기」를 거쳐 「자세히 보기」로 간다. 단추를 눌러도 초점은 단추에 남고, 펼친 글은 같은 카드 안 아래쪽에 생긴다. 「자세히 보기」도 선택지와 같은 가드 키의 입력 가드(400ms)를 받는다.</li>
<li>접기(Esc, 「잠시 덮어 두기」)는 지금처럼 접힌 띠의 「결정 다시 열기」로 간다. G2 전체 카드는 그 위에 비모달로 있고 초점을 가져가지 않는다.</li>
<li>B·C: G2 카드는 초점을 가져가지 않는다(지금 부모 카드 규칙).</li>
</ul>
<h3>낭독</h3>
<ul>
<li>A: G2 줄은 시트가 뜨기 전 같은 걸음에 인생 기록에 붙는다. 시트가 떠 있는 동안 <code>main</code>이 <code>inert</code>라 그 줄은 <code>aria-live</code>로 읽히지 않고, 시트를 닫은 뒤에도 「추가」가 아니라서 읽히지 않는다. 그래서 시트에 <code>aria-describedby="lc-chip lc-title lc-label"</code>을 단다. 열릴 때 「눈여겨보신 선생님, 대화상자」 다음에 「부모님의 결정 고등학교 원서 시험을 치르는 고등학교를 준비한다」가 한 번 읽힌다. 화면 글자를 가리키므로 새 문구가 없다. 확인할 것: NVDA·TalkBack 실기에서 설명이 이름 뒤에 한 번만 읽히는지.</li>
<li>B: 수동·1~2배속이면 인생 기록이 <code>polite</code>이다. 한 걸음에 두 줄이 붙는데, 최신순이라 그 해 카드 줄이 위, G2 줄이 아래다. 낭독은 DOM 순서(그 해 카드 → G2)로 날 가능성이 커 화면 순서와 반대다. 두 줄 모두 읽히고 순서만 다르다. <b>미확인</b>: 구현 뒤 실기로 듣고, 거슬리면 그때 고친다(인생 기록의 최신순 규칙은 바꾸지 않는다).</li>
<li>C: 자동 모드에서는 인생 기록 <code>aria-live</code>가 꺼져 있다(배속 4 이상·자동 모드 규칙). G2 카드와 인라인 카드 모두 정적이라 새로 읽히는 것이 없다. 지금과 같다.</li>
</ul>
<h3>색·강제 색상·글자 크기</h3>
<ul>
<li>G2 카드와 결정 카드는 색만으로 가르지 않는다. 집 글리프와 「부모님의 결정」 칩, 「◆ 중대 결정」 머리, 테두리(G2 1px · 결정 시트) 세 가지로 갈린다.</li>
<li>강제 색상에서는 놋쇠·쪽빛 막대가 CanvasText가 되어도 자리와 칩 글자가 뜻을 전한다. 「자세히 보기」 테두리도 CanvasText다(<code>A-360x740-forced.png</code>, <code>B-1280x800-forced.png</code>).</li>
<li>대비 쌍은 모두 기존 것(<code>design-system.md</code> 13-2)이고 새 쌍은 없다.</li>
</ul>

<h2>7. 고르지 않은 대안과 이유</h2>
<ul>
<li><b>A0 전체 카드를 시트 안에 그대로</b>: 360×740에서 결정 제목 613px, 첫 선택지 761px로 화면 밖이다. 「제목과 첫 선택지는 스크롤 없이 보인다」(<code>design-system.md</code> 11-10 구현 확인)가 깨진다.</li>
<li><b>G2를 결정 카드 아래(LR5 (b) 원래 자리)에</b>: 수동 모드에서 시트가 덮어 G2가 보이지 않는다. 후속 255의 목적(노출)을 놓친다(구현 전 기록 10-1 1).</li>
<li><b>결정 카드 머리 아래, 제목 위에 띠로</b>: 「◆ 중대 결정」 머리가 두 결정을 한 카드로 묶어 G2가 본인 결정의 일부로 읽힌다.</li>
<li><b>시트 위쪽에 탭 둘(원서 / 이번 결정)</b>: 한 시트에 두 화면이 생겨 숨은 쪽을 모를 수 있고 조작이 늘어난다.</li>
<li><b>B에서 G2를 요약형으로</b>: 360에서 둘째 카드까지 보이지만, 결과 연출 대기는 두 카드 전문의 읽기 필요량 합이다. 사람이 펼칠 계기가 없는 흐름에서 글을 접어 두는 셈이다.</li>
<li><b>C에서 G2를 요약형으로</b>: 같은 이유에 더해, 자동 선택 지연(최대 약 37초 ÷ 배속)과 화면에 보이는 글 양이 어긋난다.</li>
<li><b>두 결정을 한 테두리에 묶은 새 카드</b>: 새 부품과 새 규칙이 필요하다. 지금 부모 카드 두 장이 같은 모양으로 쌓이는 것으로 충분하다.</li>
<li>결정 카드를 잠시 숨기고 G2만 먼저 보이는 구간: 구현 전 기록 10-2에서 이미 기각했다(수동 모드에도 24~37초 대기가 생긴다).</li>
</ul>

<h2>8. 구현 메모 (developer, 형진 님 확정 뒤)</h2>
<ul>
<li>DOM: <code>section.card.decision.decision--parent.lead-card</code>(시트 안은 <code>.lead-card--compact</code> 추가), <code>data-testid="lead-card"</code>, <code>aria-labelledby="lc-title"</code>. id는 <code>lc-chip · lc-title · lc-text · lc-label · lc-stamp · lc-cite</code>, 안쪽 testid는 <code>lead-</code> 접두다. 지금 부모 카드의 <code>pc-title</code>·<code>parent-card</code>는 그대로라 B에서 두 장이 겹치지 않는다(계획 3-7).</li>
<li>시트: <code>DecisionSheet</code> 안 <code>DecisionCard</code> 앞에 요약 카드, 대화상자에 <code>aria-describedby</code>. 「자세히 보기」 = <code>btn btn--ghost btn--sm</code> + <code>aria-expanded</code> + <code>aria-controls="lc-text lc-stamp lc-cite"</code>(인용이 없으면 그 id는 빼기). 펼침은 카드의 지역 상태다. 저장하지 않고, 틱이 바뀌면 닫힌다.</li>
<li>CSS: 이 시안 <code>&lt;style&gt;</code>의 「G2 덧카드」 블록을 <code>dash.css</code> 「부모님이 정한 카드」 블록 뒤에 같은 글자로 옮긴다. 전체형(B·C·접힘)은 더할 규칙이 없다.</li>
<li>판의 첫 부모 카드 안내(<code>firstParent</code>)가 G2에 붙는 드문 판에서는, 요약형이면 펼친 영역 끝에 둔다.</li>
<li>무거운 장면 가리기: <code>school-high-pick</code>에는 <code>heavy</code> 표지가 없다. 가림 분기는 지금 <code>ParentCard</code> 규칙을 그대로 따르면 된다.</li>
<li>시험 갈고리(제안): 360×740 · 글자 100%에서 [G2 카드 아래끝 &lt; 결정 제목 위끝]과 [첫 선택지 아래끝 ≤ 화면 높이](인용 있는 본인 카드 포함), 폭 320 · 글자 200%에서 시트 가로 넘침 0, B에서 <code>lead-card</code>가 <code>parent-card</code>보다 DOM 앞.</li>
</ul>
</main>

ss="log__basis log__basis--btn" aria-expanded="false" aria-controls="why-era-2030" aria-label="예측, 가상 시나리오. 근거 보기" data-testid="why-btn">가상 시나리오</button></span><span class="log__sent">기본소득 시범에 신청 줄이 길었습니다. <span class="log__second" data-testid="log-second">집에서는 시범 신청 서류를 가장 먼저 챙겼습니다.</span></span><div class="log__why" id="why-era-2030" hidden="" data-testid="why-body"><p class="log__why-intro">이 장면과 관련된 말과 자료입니다.</p><ul><li>샘 올트먼, OpenAI CEO, 에세이 「Moore's Law for Everything」, 2021년: AI로 힘이 노동에서 자본으로 옮겨 가니 그 부를 시민에게 나누자고 제안했습니다. 기본소득 시범의 해를 말한 글은 아닙니다. 2030년은 게임이 정한 시나리오입니다.</li><li data-counter="true"><strong class="log__why-tag">반대 근거</strong> 에바 비발트 외, 논문 첫 저자, 논문 「The Employment Effects of a Guaranteed Income」(부제 생략, NBER 워킹페이퍼), 2024년: 미국 두 주 실험에서 월 현금 지급이 근로 참여를 소폭 줄였다고 보고했습니다. 미국 실험 결과이며 한국의 시범이나 2030년을 내다본 것이 아닙니다.</li></ul></div></span></li><li class="log__row" data-kind="event" data-testid="log-row"><span class="log__age">13세</span><span class="log__text">친할머니가 79세에 세상을 떠나셨습니다.</span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">12세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">방과 후의 시간, 무엇을 하며 보낼까?</span><em class="log__by log__by--parent" data-testid="log-by" data-by="parent"><svg class="icon icon--xs" aria-hidden="true" focusable="false"><use href="#i-by-parent"></use></svg>부모님이 이렇게 정했습니다: 몸을 쓰는 모임에 든다</em><span class="log__result">해가 질 때까지 공을 쫓았습니다. 몸은 단단해졌고 함께 땀 흘린 아이들과 가까워졌습니다.</span></span></li><li class="log__row" data-kind="choice" data-testid="log-row"><span class="log__age">11세</span><span class="log__text log__text--q"><span class="log__q" data-testid="log-q">학교가 끝난 오후, 무엇을 할까?</span><em class="log__by log__by--parent" data-testid="log-by" data-by="parent"><svg class="icon icon--xs" aria-hidden="true" focusable="false"><use href="#i-by-parent"></use></svg>부모님이 이렇게 정했습니다: 학교에 남아 방과 후 수업을 듣는다</em><span class="log__result">수업이 끝난 교실에 남아 학교가 여는 수업을 하나 더 들었습니다. 해가 기울 무렵 ext">첫 예방 주사를 맞던 날, 아이는 크게 울었습니다. 어른들은 아이를 안아 달랜 뒤 집으로 돌아왔습니다.</span></li><li class="log__row log__row--stage" data-kind="stage" data-testid="log-row"><span class="log__age">1세</span><span class="log__text">2017년 7월, 경상북도의 형편이 빠듯한 가정에서 3.1kg 여자아이로 태어났습니다. 첫째입니다. (3.1kg은 가운데쯤)</span></li></ol></div></section></div><div class="col col--right"><section class="card era-card" id="era-card" aria-labelledby="era-title" data-testid="era-card" data-paired="true" style="--era-card-h: 303px;"><h2 id="era-title" class="card__title card__title--gap">시대의 창</h2><div class="era" id="scene-era" data-empty="true" data-hidden="false"><span class="era__pic era__pic--empty" aria-hidden="true"><i class="era__sheet"></i></span></div></section><section class="card family" aria-labelledby="family-t" data-testid="family-card"><h2 id="family-t" class="card__title card__title--gap" tabindex="-1">식구</h2><dl class="family-list" data-testid="family-list"><dt>어머니</dt><dd data-testid="family-mother" data-state="with"><span class="family-who">김수정 48세</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="멀어짐 · 사무직" aria-hidden="true"></span>멀어짐 · 사무직</span></small></dd><dt>아버지</dt><dd data-testid="family-father" data-state="with"><span class="family-who">이성민 48세</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="데면데면함 · 단순노무직" aria-hidden="true"></span>데면데면함 · 단순노무직</span></small></dd><dt>여동생</dt><dd data-testid="family-sibling" data-state="with"><span class="family-who">이서현 14세</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="가까움 · 학생" aria-hidden="true"></span>가까움 · 학생</span></small></dd><dt>외할아버지</dt><dd data-testid="family-grandparent" data-state="apart"><span class="family-who">김상철 78세</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="가까움 · 은퇴 · 따로 삶" aria-hidden="true"></span>가까움 · 은퇴 · 따로 삶</span></small></dd><dt>외할머니</dt><dd data-testid="family-grandparent" data-state="apart"><span class="family-who">이미숙 69세</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="가까움 · 은퇴 · 따로 삶" aria-hidden="true"></span>가까움 · 은퇴 · 따로 삶</span></small></dd><dt>친구</dt><dd data-testid="family-friend" data-state="apart"><span class="family-who">이수아 16세</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="가까움 · 학생" aria-hidden="true"></span>가까움 · 학생</span></small></dd></dl><h3 class="family-sub">집에 있는 것</h3><p class="family-things" data-testid="family-things"><span class="nowrap">인터넷</span>, <span class="nowrap">세탁기</span>, <span class="nowrap">선풍기</span>, <span class="nowrap">유선 전화</span>, <span class="nowrap">컬러 텔레비전</span>, <span class="nowrap">냉장고</span></p><h3 class="family-sub">떠난 가족</h3><dl class="family-list family-list--gone" data-testid="family-gone"><dt>친할아버지</dt><dd data-testid="family-grandparent" data-state="gone"><span class="family-who">이명수</span><small><span class="fit-pair fit-pair--flow is-split" data-split="true"><span class="fit-pair__probe" data-text="내가 태어나기 전에 세상을 떠남(43세)" aria-hidden="true"></span><span class="fit-pair__item">내가 태어나기 전에 세상을 <span class="keep-phrase">떠남(<span class="nowrap">43세</span>)</span></span></span></small></dd><dt>친할머니</dt><dd data-testid="family-grandparent" data-state="gone"><span class="family-who">최순희</span><small><span class="fit-pair fit-pair--flow" data-split="false"><span class="fit-pair__probe" data-text="79세에 세상을 떠남" aria-hidden="true"></span><span class="nowrap">79세에</span> 세상을 떠남</span></small></dd></dl><button type="button" class="btn btn--ghost btn--sm family-more" aria-expanded="false" data-testid="family-more">더 보기</button><details class="disclosure family-basis" data-testid="family-basis"><summary>이 칸은 어떻게 정했나요</summary><p>식구의 이름, 나이, 사이, 직업과 집에 있는 것은 통계와 게임이 정한 값이 섞여 있습니다. 칸마다 어디까지가 통계인지 밝힙니다.</p><ul><li><strong>확인</strong> 식구가 몇 살까지 사셨는지는 통계청 간이생명표(1970~2024년)의 나이대별 사망확률로 정했습니다. 2024년 뒤에는 2024년 값을 그대로 씁니다.</li><li><strong>추정</strong> 1970년 앞의 생명표는 없어서, 1970년 값에 배율을 곱해 기대수명이 1970년대 추세선을 거꾸로 이은 값이 되게 맞췄습니다(30세 아래로는 내리지 않았습니다).</li><li><strong>확인</strong> 어머니가 아이를 낳은 나이는 인구동향조사의 연령별 출생아 구성비(1981~2025년)를 썼습니다.</li><li><strong>확인(환산)</strong> 1956~1980년은 인구총조사의 어머니 연령별 자녀 수를 거슬러 계산했습니다(오차 ±0.5세).</li><li><strong>추정</strong> 1956년 앞 출생은 1966년 인구총조사 표본의 출산 어머니 나이 분포(평균 29.7세)를 그대로 거슬러 썼습니다. 한 해의 분포를 앞 시대에 이은 추정입니다.</li><li><strong>확인(환산)</strong> 조부모와 함께 사는 비율은 인구총조사의 아동 가구 세대 구성(2000년과 2005년)에서 계산했습니다.</li><li><strong>추정</strong> 그 밖의 해는 3세대 이상 가구 비율에 1.85를 곱해 이었습니다(2000년과 2005년의 실제 배율 1.73과 1.99의 가운데).</li><li><strong>설계값</strong> 함께 사는 조부모가 친가인지 외가인지는 통계가 없어 친가 70%, 외가 30%로 정했습니다.</li><li><strong>확인(환산)</strong> 부모의 이혼은 이혼 건수에 미성년 자녀 수의 하한을 곱해 미성년 인구로 나눈 근사입니다(1993~2025년).</li><li><strong>추정</strong> 1993년 앞은 1993년 값에 조이혼율의 비를 곱해 줄였습니다.</li><li><strong>설계값</strong> 이혼으로 떠난 부모와 같은 쪽 조부모는 다음 해부터 따로 사는 것으로 했습니다. 이혼 뒤 그 집안 조부모와 함께 사는 일은 드물다고 본 설계값입니다.</li><li><strong>확인(환산)</strong> 집의 종류는 인구총조사 거처의 종류별 가구 수(시도별, 1970~2025년)에서 여섯 칸 구성비를 계산했습니다. 전체 가구 기준이라 갓난아이가 있는 가구의 특성은 따로 보정하지 않았습니다.</li><li><strong>추정</strong> 조사한 해 사이는 두 해를 이어 계산하고, 분류가 바뀐 구간(1975→80, 2000→05, 2010→15)은 가까운 해의 값을 썼습니다. 시도 줄이 없던 승격 전 광역시는 부모 도의 줄을 썼습니다.</li><li><strong>설계값</strong> 1969년 이하 출생은 1970년 구성비를 거슬러 썼습니다(건물 종류 표가 없습니다). 아파트는 0.1%, 다세대는 0으로 두고, 주택 이외의 거처는 1940~1999년 출생에서만 나옵니다.</li><li><strong>설계값</strong> 자가, 임차, 무상과 소득계층(수저 단계)은 인구총조사와 주거실태조사의 표를 서로 독립이라고 가정해 곱했습니다. 수저 단계를 소득계층으로 섞는 방법은 출생신고와 같고, 시도를 수도권, 광역시 등, 도지역 세 갈래로 묶은 것은 게임이 정했습니다.</li><li><strong>설계값</strong> 단독주택에 임차로 사는 가구 가운데 셋방인 비율(1990년 앞 85%, 2005년 60%, 2020년 50%)은 통계가 없어 게임이 정했습니다.</li><li><strong>확인(환산)</strong> 방 수는 인구총조사(1980~2010년)의 거처 종류와 가구원 수별 표에서 뽑았습니다. 1980년 앞은 1980년, 2010년 뒤는 2010년 값을 쓰고, 그해에 아주 드문 방 수는 쓰지 않았습니다.</li><li><strong>설계값</strong> 1945년 이전 출생 어머니는 자녀가 많던 시대라, 형제 수가 인구총조사의 평균 출생아 수와 ±0.45명 안에서 맞도록 게임이 값을 조정했습니다.</li><li><strong>설계값</strong> 19세 이하에 부모 한 분이 떠난 해에는 한 번만 건강 −1, 관계 −2, 행복 −8과 집안 살림(아버지 −500만 원, 어머니 −300만 원에 재력 배율 0.8~2.0)이 더해집니다. 통계가 없는 설계값입니다.</li><li><strong>설계값</strong> 아래 동생 수는 출생 순위별 출생 비중에서 유도한 근사이고, 터울 2~5년, 독립 나이 20~30세, 성별은 반반으로 게임이 정했습니다.</li><li><strong>설계값</strong> 식구 이름은 그 사람의 출생 연도에 맞는 이름 풀에서 뽑았습니다. 1940년대보다 앞서 태어난 분(주로 조부모)은 가장 오래된 1940년대 풀을, 2020년 뒤에 태어난 자녀는 가장 최근 풀을 대신 썼고, 1940년대 풀 자체도 통계가 아닌 추정 목록입니다. 성은 아버지 쪽과 형제가 주인공과 같고 어머니와 조모는 따로 뽑았습니다.</li><li><strong>설계값</strong> 부모의 직업은 출생신고에 적힌 값입니다. 은퇴 나이는 농림어업 65~75세, 그 밖 55~65세로 게임이 정했고, 그 나이가 되면 직업 줄이 「은퇴」로 바뀝니다.</li><li><strong>설계값</strong> 형제, 배우자, 자녀, 친구, 조부모의 직업은 통계가 없어, 출생신고의 직업 분포에 시대 보정을 한 값에서 한 번 뽑았습니다. 6~22세는 「학생」으로 봅니다.</li><li><strong>설계값</strong> 배우자, 자녀, 가까운 친구의 수와 나이는 통계가 아니라 게임이 정했습니다. 배우자와의 나이 차는 부모 나이 차와 같은 모양이되 처음 만난 해에 20세 이상이고, 자녀는 첫 자녀를 낳은 시대에 따라 1~4명(경제에는 쓰이지 않고 보이기만 합니다), 터울은 2~5년, 친구는 1~3명입니다.</li><li><strong>설계값</strong> 사이의 다섯 단계(아주 가까움~멀어짐)는 통계가 없습니다. 호칭별 기본값, 부모는 양육 방식, 사람마다 한 단계 안팎의 차이에 더해 사건이 바꾼 것만 반영합니다. 사건 없이 슬며시 바뀌지 않습니다.</li><li><strong>설계값</strong> 반려동물의 이름 목록과 수명(개 10~16년, 고양이 12~18년, 그 밖 2~8년)은 통계가 없어 게임이 정했습니다. 부모 집의 반려동물은 아직 만들지 않고, 사건으로 들인 동물만 보입니다.</li><li><strong>설계값</strong> 집에 있는 것의 보급된 해와 보급 속도는 가구 내구재 보급 통계를 찾아 맞추기 전에 게임이 정한 값입니다. 수저 단계가 높을수록 일찍 들이지만 전체 평균은 이 곡선 그대로입니다. 2025년 뒤에는 새 물건을 만들지 않고, 보급률 숫자는 화면에 쓰지 않습니다.</li></ul></details></section><section class="card peers-now" aria-labelledby="peers-now-t" data-testid="peers-now-card"><div class="card__head card__head--tight"><h2 id="peers-now-t" class="card__title">같은 해 태어난 사람들</h2><span class="card__sub">요즘 모습</span></div><ul class="people" data-testid="peers-now"><li data-testid="peer-now"><div class="people__who"><div class="people__line"><span class="name" data-testid="peer-now-name">정예준</span> <span class="sub">남성</span></div><div class="sub">서울특별시</div></div><span class="grade grade--4" data-grade="4"><svg class="spoon" aria-hidden="true" focusable="false"><use href="#sp-4"></use></svg><span>금수저</span><span class="grade__dots" role="img" aria-label="5단계 중 4단계"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></span></span><span class="people__now" data-testid="peer-now-label">학교에 다님</span></li><li data-testid="peer-now"><div class="people__who"><div class="people__line"><span class="name" data-testid="peer-now-name">정하은</span> <span class="sub">여성</span></div><div class="sub">경기도</div></div><span class="grade grade--3" data-grade="3"><svg class="spoon" aria-hidden="true" focusable="false"><use href="#sp-3"></use></svg><span>은수저</span><span class="grade__dots" role="img" aria-label="5단계 중 3단계"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span></span><span class="people__now" data-testid="peer-now-label">학교에 다님</span></li><li data-testid="peer-now"><div class="people__who"><div class="people__line"><span class="name" data-testid="peer-now-name">이지후</span> <span class="sub">남성</span></div><div class="sub">강원도(지금의 강원특별자치도)</div></div><span class="grade grade--1" data-grade="1"><svg class="spoon" aria-hidden="true" focusable="false"><use href="#sp-1"></use></svg><span>흙수저</span><span class="grade__dots" role="img" aria-label="5단계 중 1단계"><i class="on"></i><i></i><i></i><i></i><i></i></span></span><span class="people__now" data-testid="peer-now-label">학교에 다님</span></li><li data-testid="peer-now"><div class="people__who"><div class="people__line"><span class="name" data-testid="peer-now-name">이예린</span> <span class="sub">여성</span></div><div class="sub">경상남도</div></div><span class="grade grade--4" data-grade="4"><svg class="spoon" aria-hidden="true" focusable="false"><use href="#sp-4"></use></svg><span>금수저</span><span class="grade__dots" role="img" aria-label="5단계 중 4단계"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></span></span><span class="people__now" data-testid="peer-now-label">학교에 다님</span></li></ul><p class="t-xs t-faint card__note">나이와 수저에 따라 정한 설계값입니다(통계가 아님).</p></section></div></main></template>
